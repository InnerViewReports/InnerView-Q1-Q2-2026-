          body: 'Across the captured roles, well-covered skills far outnumber the gaps. Well done!' });
      } else if (currentDept === 'Data Science') {
        // Curated: short mapping nudge, then the adoption win — DS is fully captured.
        items.push({ color: AMB, title: 'Skill coverage has blind spots',
          body: 'For the skills coming up short, mapping them directly into scorecards helps make sure they don\u2019t go undiscussed.' });
        items.push({ color: GRN, title: 'BrightHire adoption is complete',
          body: 'Every role this period was captured on BrightHire by some of the panelists, well done!' });
      } else if (currentDept === 'Account Management') {
        // Curated: only one of the department's roles ran on BrightHire this period.
        items.push({ color: AMB, title: 'Skill coverage has blind spots',
          body: 'Only one role this period has panelists using BrightHire. Encouraging your interviewers to run interviews on BrightHire gets those loops captured here.' });
      } else {
        const hasWeak = !!(recurring || worst);
        const tails = [];
        if (ghostCount > 0) tails.push('encouraging your interviewers to run interviews on BrightHire gets those loops captured here');
        if (hasWeak) tails.push('for the skills coming up short, mapping them directly into scorecards helps make sure they don\u2019t go undiscussed');
        const tail = tails.length === 2
          ? 'Encouraging your interviewers to run interviews on BrightHire gets those loops captured here, and for the skills coming up short, mapping them directly into scorecards helps make sure they don\u2019t go undiscussed.'
          : tails[0].charAt(0).toUpperCase() + tails[0].slice(1) + '.';
        items.push({ color: AMB, title: 'Skill coverage has blind spots',
          body: parts.join(', and ') + '. ' + tail });
      }
    }
  }

  // ── On-track fallback when nothing rose to a callout ──
  if (!items.length) {
    items.push({ color: GRN, title: 'Engagement looks on track',
      body: 'No quality flags, scorecards inside the window, and interview load reasonably spread this period.' });
  }
  return { items: items.slice(0, 4) };
}

function metricsInsights(data) {
  data = data || {};
  const obs = [], rec = [];
  const s     = data.stats || {};
  const all   = data.all_interviewers || [];
  const coord = data.coordination || {};
  // Overall decline rate
  const dr = s.decline_rate_pct || 0;
  if (dr >= 20) {
    obs.push('Overall decline rate is ' + dr + '% — above the 20% concern threshold.');
    rec.push('The elevated decline rate is concentrated among a few interviewers — load distribution is the usual lever if the root cause turns out to be availability rather than fit.');
  } else if (dr >= 12) {
    obs.push('Decline rate is ' + dr + '% — approaching levels that could slow candidate throughput.');
  }
  // High individual decliners — the per-interviewer flag list now lives on the Engagement
  // tab (load-balance "Decline behavior"), so we don't repeat a count callout here.
  // The scheduling-pattern recommendation still applies as a "what to do" pointer.
  const high = all.filter(i => i.declines >= 3 && i.declines / ((i.completed || 0) + i.declines) > 0.3);
  // Top decline reason — relabel "Other" to "No reason provided" (the export marks declines
  // with no reason entered as "Other") and frame it as a participation signal when it leads.
  const reasons = data.decline_reasons || [];
  const top = reasons.length ? reasons.reduce((a, b) => (b.count || 0) > (a.count || 0) ? b : a, reasons[0]) : null;
  if (top && top.pct >= 35) {
    const rl = top.reason.toLowerCase().trim();
    if (rl === 'other') {
      obs.push('Most declines give coordinators nothing to act on — ' + top.pct + '% come with no reason, alternative time, or replacement, leaving the loop to be rebuilt from scratch.');
    } else {
      obs.push('"' + top.reason + '" is the top decline reason at ' + top.pct + '% of all declines this period.');
    }
  }
  // Avg lead time
  const avgLT = data.avg_lead_time_hrs;
  if (avgLT !== null && avgLT !== undefined && avgLT < 24) {
    obs.push('Average decline lead time is only ' + avgLT + ' hrs — interviewers are declining with less than 24 hours notice on average.');
  }
  // Coordination: reschedule rate
  const rescPct = coord.reschedule_pct || 0;
  const fac = coord.facilitated || 0;
  const can = coord.canceled || 0;
  if (rescPct >= 20) {
    obs.push(rescPct + '% of facilitated interviews required rescheduling — above the 20% threshold.');
  }
  const disr = coord.interview_changes || 0;
  const intvBase = interviewsCompleted(data);
  if (intvBase > 0 && disr > 0) {
    const changeRate = Math.round(disr / intvBase * 100);
    const ratioWord = changeRate >= 50 ? 'more than one change for every two interviews run'
      : changeRate >= 30 ? 'roughly one change for every three interviews run'
      : changeRate >= 15 ? 'one change for every six to seven interviews run'
      : 'a light change load relative to interviews run';
    obs.push('Coordinators handled ' + fmt(disr) + ' interview changes against ' + fmt(intvBase) + ' interviews (' + changeRate + '%) — ' + ratioWord + '.');
  }
  // Who drives the changes — interviewer vs candidate (from rsc_interviewer_pct).
  const rscIntvPct = coord.rsc_interviewer_pct || 0;
  if (rscIntvPct >= 50) {
    obs.push('Interviewers drove ' + rscIntvPct + '% of changes (vs candidates) — the churn is mostly coming from the panel side, not candidates.');
  }
  // Insights & recommendations — three themed takeaways (the boxes above are the evidence,
  // so these stay generalized and story-led): calendar hygiene, coordinator time, candidate
  // experience. Calendar/coordinator always apply where there's decline/coordination signal;
  // the candidate-experience one is gated on coordination data existing.
  const hasDeclineSignal = (data.decline_reasons || []).length > 0 || all.some(i => (i.declines || 0) > 0);
  const hasCoordSignal = disr > 0;
  if (hasDeclineSignal || hasCoordSignal) {
    rec.push('<strong style="color:#b45309;font-weight:700">Calendar hygiene</strong> — the biggest lever sits with interviewers keeping availability accurate and honoring committed slots. Most reschedules and declines here are avoidable with cleaner upfront calendars.');
    rec.push('<strong style="color:#b45309;font-weight:700">Coordinator time</strong> — a simple expectation when declining (give a reason, suggest a swap or a new time) would turn dead-end declines into something a coordinator can act on, cutting redo work.');
  }
  if (hasCoordSignal) {
    rec.push('<strong style="color:#b45309;font-weight:700">Candidate experience</strong> — candidates absorb churn they didn\u2019t cause; fewer panel changes protect their experience.');
  }
  return { obs, rec };
}

// Canonical "interviews completed" for a department: the higher of the two
// source systems — Greenhouse (sum of per-interviewer completed) and ModernLoop
// (facilitated). Whichever captured more is treated as the fuller record.
// One number, used identically on Summary, Engagement, and Metrics.
function interviewsCompleted(data) {
  // Explicit override: authoritative count from Greenhouse "Interviewing Activity"
  // exports ('Number of Interviews' summed across the department's req groups).
  // Takes precedence over the derived numbers below when present.
  if (data.interviews_completed != null) return data.interviews_completed;
  const gh = (data.all_interviewers || []).reduce((s, i) => s + (i.completed || 0), 0);
  const ml = (data.coordination || {}).facilitated || 0;
  return Math.max(gh, ml);
}
// Canonical interviewer pool for DECLINE stats: the trained panel where it exists
// (the real interviewer population — 222 trained / active subset), otherwise the
// engagement export. This keeps decline counts consistent everywhere. For Engineering
// this is the panel (226 declines), not the smaller engagement export (196).
function declinePool(data) {
  const panel = data.eng_panel || [];
  return panel.length ? panel : (data.all_interviewers || []);
}
function totalDeclines(data) {
  return declinePool(data).reduce((s, i) => s + (i.declines || 0), 0);
}

  const dedupeOpenings = (list) => {

            '<div style="font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#9aa0c8;margin-bottom:14px">' + (currentDept || '') + ' \u00b7 ' + (D.meta.quarter || '') + '</div>' +
            '<div style="font-size:60px;font-weight:800;color:#fff;line-height:.95;letter-spacing:-2px" data-count="' + interviewsCompleted(data) + '">' + fmt(interviewsCompleted(data)) + '</div>' +
            '<div style="font-size:13px;color:#aab0d4;margin-top:10px">interviews completed</div>' +
          '</div>' +
        '</div>' + heroStats +
      '</div>' +
    '</div>';
  const qagHtml = heroHtml +
    '<div class="ds-body-surface">' + qagBody + '</div>';
  // ── Assemble Summary: hero + surfaces → roles ──
  let html = qagHtml + rolesHtml;
  // ── 3. Top & Flagged Interviewers ───────────────────────────
  if (all.length) {
    // Composite scoring: volume 40% + inverted decline rate 35% + BH 25%
    // If BH is absent, redistribute weight: volume 53% + inverted decline 47%
    const maxVol = Math.max(...all.map(i => i.completed || 0)) || 1;
    const scored = all.map(i => {
      const vol   = i.completed || 0;
      const total = vol + (i.declines || 0);
      const dr    = total > 0 ? i.declines / total : 0;
      const inv   = 1 - dr;
      // Composite = volume + decline rate only (BrightHire no longer factored in).
      const score = (vol / maxVol) * 0.53 + inv * 0.47;
      const drPct = total > 0 ? Math.round(dr * 100) : 0;
      const bhRec = bhMap[i.name];
      return { ...i, _score: score, _dr: drPct, _bh: bhRec ? bhRec.overall : null };
    });
    // Top 5 by composite — quality gate: must have completed >=1 and decline rate <=25%.
    const tops = scored
      .filter(i => {
        if ((i.completed || 0) < 1) return false;
        if (i._dr > 25) return false;   // too many declines
        return true;
      })
      .sort((a, b) => b._score - a._score)
      .slice(0, 5);
    // (Highest activity interviewers relocated to the Engagement tab, under the
    //  decline-behavior evidence in the load balance area.)
  }
  html += '<div class="timestamp">Generated ' + D.meta.generated_date + ' · Source: ModernLoop + BrightHire + Greenhouse</div>';
  document.getElementById('tab-overview').innerHTML = html;
}
// Highest activity interviewers (ICs only) — self-contained section, rendered under
// the decline-behavior evidence on the Engagement tab as the positive counterpart.
function highestActivitySection(data) {
  const all = data.all_interviewers || [];
  if (!all.length) return '';
  const maxVol = Math.max(...all.map(i => i.completed || 0)) || 1;
  const scored = all.map(i => {
    const vol = i.completed || 0;
    const total = vol + (i.declines || 0);
    const dr = total > 0 ? i.declines / total : 0;
    const score = (vol / maxVol) * 0.53 + (1 - dr) * 0.47;
    return { ...i, _score: score, _dr: total > 0 ? Math.round(dr * 100) : 0 };
  });
  const isMgr = i => (i.level || '').toUpperCase().startsWith('M');
  const icTops = scored
    .filter(i => (i.completed || 0) >= 1 && i._dr <= 25 && !isMgr(i))
    .sort((a, b) => b._score - a._score)
    .slice(0, 5);
  if (!icTops.length) return '';
  const rows = icTops.map((i, idx) => {
    const drColor = i._dr > 30 ? '#974859' : i._dr > 15 ? '#BA6029' : 'var(--text-secondary)';
    return '<tr>' +
      '<td style="font-size:12px;color:var(--text-secondary);width:24px">' + (idx + 1) + '</td>' +
      '<td style="font-weight:500">' + i.name + '</td>' +
      '<td style="font-size:12px;color:var(--text-secondary);width:42px">' + (i.level || '—') + '</td>' +
      '<td style="font-size:12px;color:var(--text-secondary)">' + (i.team || '—').replace('Pillar - ', '') + '</td>' +
      '<td style="text-align:right;color:var(--text-secondary)">' + fmt((i.completed || 0) + (i.declines || 0)) + '</td>' +
      '<td style="text-align:right;font-weight:600">' + fmt(i.completed) + '</td>' +
      '<td style="text-align:right;font-weight:600;color:' + drColor + '">' + i._dr + '%</td>' +
      '</tr>';
  }).join('');
  const body = '<div class="table-wrap" style="margin-bottom:0">' +
    '<table class="data-table"><thead><tr>' +
    '<th style="width:24px">#</th><th>Name</th><th>Level</th><th>Team</th>' +
    '<th style="text-align:right">Assigned</th>' +
    '<th style="text-align:right">Completed</th>' +
    '<th style="text-align:right">Decline Rate</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  return sectionShell('Highest activity interviewers', body,
    'Individual contributors ranked by activity — interview volume balanced against decline rate (25% or less to qualify). Managers are excluded — they carry high volume by default.');
}

        '<div style="font-size:15px;line-height:1.55;color:#EAE4FB;margin-top:12px">'+implication+'</div></div>' +
    '</div></div></div>';

  // people drill-down → BehaviorClusters interactive panel (data serialized for the hover engine)
  var ivcPeople = people.map(function(p){

  var ivcData = {N:N, reach:{conv:reach('conv'),struct:reach('struct'),fb:reach('fb')}, people:ivcPeople};
  var ivcJSON = esc(JSON.stringify(ivcData));

function renderEngagement(data) {

  if (skills.length) {

      body += '<div style="display:flex;gap:10px;align-items:flex-start;background:#eef4fb;border:1px solid #cfe0f4;border-radius:8px;padding:10px 12px;margin:14px 18px 18px">' +

  }


  // ── Insights and recommendations — the one consolidated box, bottom of the tab ──
  {
    var secColors=['#5AD7D2','#86E8B4','#F7B6C2','#FAD788'];

    var cards = auto.items.slice(0,4).map(function(s2,i){

    html += '<section class="eng-ai-panel"><div class="eng-ai-fx"></div>' +
      '<div class="eng-ai-head"><span class="eng-ai-diamond"></span><span class="eng-ai-eyebrow">AI Insights</span>' +
        '<span class="eng-ai-sub">What the data patterns suggest and where to focus.</span><span class="eng-head-rule" style="background:linear-gradient(90deg,rgba(201,182,255,.4),rgba(255,255,255,.06))"></span></div>' +

function renderMetrics(data) {
  const s     = data.stats || {};
  const coord = data.coordination || {};
  const all   = (data.all_interviewers || []).slice().sort((a,b) => (b.declines||0)-(a.declines||0));
  if (!s.total_declines && !all.length && !(coord.facilitated)) {
    document.getElementById('tab-metrics').innerHTML = empty('No metrics data for this department.');
    return;
  }
  let html = '';

  // ─── derived ──────────────────────────────────────────────────────────
  const coordFac       = coord.facilitated || 0;
  const coordRsc       = coord.rescheduled || 0;
  const coordCan       = coord.canceled || 0;
  const coordChg       = coord.changed || 0;
  const coordDisr      = coord.disruptions || (coordRsc + coordCan + coordChg);
  const coordDisrRate  = coord.disruption_rate || (coordFac ? Math.round(coordDisr/coordFac*100) : 0);
  const coordIntv      = coord.interviewer_driven_reschedules || 0;
  const coordLate      = coord.late_declines || 0;
  const coordVeryLate  = coord.very_late_declines || 0;
  const coordSameDay   = coord.same_day_declines || 0;
  const coordUniqCand  = coord.unique_candidates_affected || 0;
  const coordTotalCand = coord.total_unique_candidates || 0;
  const coordHrsLost   = coord.est_coord_hrs_lost || 0;
  const coordReasons   = coord.reschedule_reasons || [];
  const intvPct        = coordRsc ? Math.round(coordIntv/coordRsc*100) : 0;

  const dpool          = declinePool(data);
  const dTotal         = totalDeclines(data);
  const dActive        = dpool.filter(i=>(i.completed||0)>0);
  const dDecliners     = dpool.filter(i=>(i.declines||0)>0);
  const repeatDecliners = dDecliners.filter(i=>(i.declines||0)>=3);
  const oneOffDecliners = dDecliners.filter(i=>(i.declines||0)<3);
  const repeatDecl     = repeatDecliners.reduce((s,i)=>s+(i.declines||0),0);
  const repeatShare    = dTotal ? Math.round(repeatDecl/dTotal*100) : 0;
  const activeCount    = dActive.length;
  const declinerShare  = activeCount ? Math.round(dDecliners.length/activeCount*100) : 0;
  const declAsIntPct   = coordFac ? Math.round(dTotal/coordFac*100) : 0;
  const latePct        = dTotal ? Math.round(coordLate/dTotal*100) : 0;
  const veryLatePct    = dTotal ? Math.round(coordVeryLate/dTotal*100) : 0;
  const cancelRate     = coordFac ? Math.round((coord.canceled_primary||coordCan)/coordFac*100) : 0;


  // ─── SECTION 1: COORDINATION LOAD — 3 cards ─────────────────────────
  const chgCount = coord.interview_changes || 0;
  const chgRate  = coord.change_rate || 0;
  const rscIntv  = coord.rsc_interviewer_pct || 0;
  const rscCand  = coord.rsc_candidate_pct  || 0;
  // ═══════════════════ OBSERVATORY RENDER ═══════════════════

window.obsInit=function(){
  var env=document.querySelector('.obs-env'); if(!env) return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var pending=false, lastE=null;
  function apply(){
    pending=false; var e=lastE; if(!e) return;
    var r=env.getBoundingClientRect();
    var mx=((e.clientX-r.left)/r.width)*2-1, my=((e.clientY-r.top)/r.height)*2-1;
    env.style.setProperty('--mx',mx.toFixed(3));
    env.style.setProperty('--my',my.toFixed(3));
    env.style.setProperty('--go','1');
    // per-module local specular
    env.querySelectorAll('[data-glow]').forEach(function(el){
      var b=el.getBoundingClientRect();
      el.style.setProperty('--gx',(e.clientX-b.left)+'px');
      el.style.setProperty('--gy',(e.clientY-b.top)+'px');
    });
  }
  env.addEventListener('pointermove',function(e){
    lastE=e; if(!pending){pending=true;requestAnimationFrame(apply);}
  });
  env.addEventListener('pointerleave',function(){
    env.style.setProperty('--go','0');
    env.style.setProperty('--mx','0'); env.style.setProperty('--my','0');
  });
  // per-pane tilt (only while pointer inside the pane)
  if(!reduce){
    env.querySelectorAll('[data-tilt]').forEach(function(el){
      var tp=false, te=null;
      function tapply(){tp=false; if(!te) return; var b=el.getBoundingClientRect();
        var tx=((te.clientX-b.left)/b.width)*2-1, ty=((te.clientY-b.top)/b.height)*2-1;
        el.style.setProperty('--tx',tx.toFixed(3)); el.style.setProperty('--ty',ty.toFixed(3));}
      el.addEventListener('pointermove',function(e){te=e; if(!tp){tp=true;requestAnimationFrame(tapply);}});
      el.addEventListener('pointerleave',function(){el.style.setProperty('--tx','0');el.style.setProperty('--ty','0');});
    });
  }
  // popovers (Method / Who's included chips)
  var pop=document.getElementById('obs-pop');
  if(!pop){pop=document.createElement('div');pop.id='obs-pop';pop.className='obs-pop';document.body.appendChild(pop);}
  function showPop(el){
    pop.textContent=el.getAttribute('data-pop'); pop.classList.add('show');
    var r=el.getBoundingClientRect();
    var left=Math.min(r.left, window.innerWidth-360);
    pop.style.top=(r.bottom+8)+'px'; pop.style.left=Math.max(12,left)+'px';
  }
  function hidePop(){pop.classList.remove('show');}
  env.querySelectorAll('[data-pop]').forEach(function(el){
    el.addEventListener('mouseenter',function(){showPop(el);});
    el.addEventListener('mouseleave',hidePop);
    el.addEventListener('focus',function(){showPop(el);});
    el.addEventListener('blur',hidePop);
  });
};

var IVC_T={conv:{name:'Conversation',c:'#F7B6C2',g:'rgba(247,140,165,.7)'},struct:{name:'Structure',c:'#F6C9A8',g:'rgba(246,170,110,.7)'},fb:{name:'Feedback',c:'#FF8C9C',g:'rgba(255,90,115,.7)'}};
var IVC_ORDER=['conv','struct','fb'];
var IVC_THEME_OF={'Talk ratio':'conv','Question opportunity':'conv','Agenda setting':'struct','Feedback timeliness':'fb','Feedback rate':'fb'};
function ivcLabel(key){return key==='none'?'No recorded below-bar signals':key.split('+').map(function(k){return IVC_T[k].name;}).join(' + ');}
function ivcRender(mount){
  var data; try{data=JSON.parse(mount.getAttribute('data-ivc'));}catch(e){return;}
  var people=data.people||[], N=data.N||people.length;
  var reach=function(id){return people.filter(function(p){return p.th[id];}).length;};
  // clusters
  var m={}; people.forEach(function(p){(m[p.key]=m[p.key]||[]).push(p);});
  var clusters=Object.keys(m).map(function(key){return {key:key,members:m[key]};})
    .sort(function(a,b){return (a.key==='none')-(b.key==='none') || b.members.length-a.members.length || b.key.split('+').length-a.key.split('+').length;});
  mount._ivc={people:people,N:N,clusters:clusters,reach:reach,hl:null};
  var keyHtml='<div class="ivc-key"><span class="ivc-eyebrow">Behavior clusters</span>' +
    IVC_ORDER.map(function(id){return '<span class="ivc-pill" data-theme="'+id+'" style="--c:'+IVC_T[id].c+';--g:'+IVC_T[id].g+'"><span class="ivc-bar"></span><span class="ivc-pillname">'+IVC_T[id].name+'</span><span class="ivc-pilln">'+reach(id)+' of '+N+'</span></span>';}).join('') +
    '<span class="ivc-readout">Hover a behavior or a person to see who shares the pattern</span></div>';
  var clHtml=clusters.map(function(cl,ci){
    var ks=cl.key.split('+');
    var popRight=ci>=clusters.length-2;
    var bars=IVC_ORDER.map(function(k){return '<span class="ivc-cbar" style="background:'+(ks.indexOf(k)>=0?IVC_T[k].c:'rgba(255,255,255,.12)')+'"></span>';}).join('');
    var chips=cl.members.map(function(mem){
      var pops=mem.sigs.map(function(s){return '<div class="ivc-poprow"><span class="ivc-dot" style="background:'+IVC_T[IVC_THEME_OF[s.label]].c+'"></span><span style="flex:1;color:#CDD4E6">'+s.label+'</span><span style="font-weight:620;color:'+(s.value<60?'#FFD6DE':'#FCEBBA')+'">'+s.value+'</span></div>';}).join('');
      var popStyle=popRight?'top:0;left:calc(100% + 10px)':'top:calc(100% + 6px);left:0';
      return '<div class="ivc-chip" data-name="'+String(mem.name).replace(/"/g,'&quot;')+'" data-key="'+cl.key+'">' +
        '<div><div class="ivc-name">'+mem.name+'</div><div class="ivc-sub">'+mem.interviews+' interviews</div></div>' +
        '<span class="ivc-score" style="color:'+(mem.overall<70?'#FAD788':'#EDE3C8')+'">'+mem.overall+'</span>' +
        '<div class="ivc-pop" style="opacity:0;transform:translateY(4px);'+popStyle+'"><div class="ivc-eyebrow" style="margin-bottom:6px">Below-bar signals</div>'+pops+'</div>' +
      '</div>';
    }).join('');
    return '<div class="ivc-cluster" data-key="'+cl.key+'"><div><div class="ivc-cbars">'+bars+'</div><div class="ivc-clabel">'+ivcLabel(cl.key)+'</div><div class="ivc-csize">'+cl.members.length+' '+(cl.members.length===1?'interviewer':'interviewers')+'</div></div><div class="ivc-people">'+chips+'</div></div>';
  }).join('');
  mount.innerHTML='<div class="ivc-panel"><div>'+keyHtml+'</div><div class="ivc-clusters">'+clHtml+'</div></div>';
  var panel=mount.querySelector('.ivc-panel');

  panel.querySelectorAll('.ivc-pill').forEach(function(pl){pl.addEventListener('mouseenter',function(){ivcApply(mount,{type:'theme',id:pl.getAttribute('data-theme')});});});
  panel.querySelectorAll('.ivc-chip').forEach(function(ch){ch.addEventListener('mouseenter',function(){ivcApply(mount,{type:'person',name:ch.getAttribute('data-name')});});});

}
function ivcApply(mount,hl){
  var st=mount._ivc; if(!st) return; st.hl=hl;
  var people=st.people, N=st.N;
  var hp = hl && hl.type==='person' ? people.find(function(p){return p.name===hl.name;}) : null;
  var panel=mount.querySelector('.ivc-panel');
  // readout
  var ro=panel.querySelector('.ivc-readout');
  if(!hl) ro.textContent='Hover a behavior or a person to see who shares the pattern';
  else if(hl.type==='theme') ro.textContent=IVC_T[hl.id].name+' shows up for '+st.reach(hl.id)+' of '+N+' interviewers';
  else { var n=people.filter(function(p){return p.key===hp.key && p.name!==hp.name;}).length; ro.textContent = n? hp.name+' shares the '+ivcLabel(hp.key)+' pattern with '+n+' '+(n===1?'other':'others') : hp.name+' is the only '+ivcLabel(hp.key)+' pattern'; }
  // pills
  panel.querySelectorAll('.ivc-pill').forEach(function(pl){pl.classList.toggle('is-active', !!hl && hl.type==='theme' && hl.id===pl.getAttribute('data-theme'));});
  // clusters
  panel.querySelectorAll('.ivc-cluster').forEach(function(cl){
    var key=cl.getAttribute('data-key'); var ks=key.split('+');
    var lit=!hl; if(hl&&hl.type==='theme') lit=ks.indexOf(hl.id)>=0; if(hp) lit=key===hp.key;
    cl.style.opacity=lit?1:.4;
  });
  // chips
  panel.querySelectorAll('.ivc-chip').forEach(function(ch){
    var name=ch.getAttribute('data-name'), key=ch.getAttribute('data-key');
    var person=people.find(function(p){return p.name===name;});
    var lit=!hl, self=false;
    if(hl&&hl.type==='theme') lit=!!(person&&person.th[hl.id]);
    if(hp){ self=(name===hp.name); lit=(key===hp.key); }
    var themeGlow = (hl&&hl.type==='theme'&&lit) ? ',0 0 26px -8px '+IVC_T[hl.id].g : '';
    ch.style.opacity = lit?1:.28;
    ch.style.zIndex = self?30:1;
    ch.style.transform = self?'translateY(-4px)':((lit&&hl)?'translateY(-2px)':'none');
    ch.style.background = self?'linear-gradient(160deg,rgba(235,232,255,.2),rgba(200,200,245,.07))':((lit&&hl)?'linear-gradient(160deg,rgba(235,232,255,.13),rgba(200,200,245,.04))':'linear-gradient(160deg,rgba(235,232,255,.07),rgba(200,200,245,.02))');
    ch.style.boxShadow = self?'inset 0 .5px 0 rgba(255,255,255,.6),0 0 0 .5px rgba(255,255,255,.35),0 24px 40px -16px rgba(2,3,14,.9)':(themeGlow?'inset 0 .5px 0 rgba(255,255,255,.45),0 0 0 .5px rgba(255,255,255,.22)'+themeGlow:'inset 0 .5px 0 rgba(255,255,255,.3),0 0 0 .5px rgba(255,255,255,.12)');
    var pop=ch.querySelector('.ivc-pop');
    if(pop){ pop.style.opacity=self?1:0; pop.style.transform=self?'none':'translateY(4px)'; }
  });
}

  if(c){ c.classList.add('swapping'); setTimeout(function(){apply();c.classList.remove('swapping');},140); }
  else apply();
  rsIdx=i;
}
function rsSelect(row){ rsFill(+row.getAttribute('data-idx')); }
function rsStep(dir){ if(!rsData.length) return; var n=(rsIdx+dir+rsData.length)%rsData.length; rsFill(n); }
window.obsInit=(function(prev){
  return function(){
    if(prev) prev();
    var plane=document.querySelector('.rs-plane');
    if(plane){
      try{ rsData=JSON.parse(plane.getAttribute('data-people'))||[]; }catch(e){ rsData=[]; }
      rsIdx=0;
      // fill without the swap animation on first render
      if(rsData.length){ var p=rsData[0];
        plane.querySelector('.rs-spot-name').textContent=p.name;
        plane.querySelector('.rs-spot-lvl').textContent=p.level||'';
        plane.querySelector('.rs-spot-team').textContent=p.team||'';
        plane.querySelector('.rs-big').textContent=(p.completed).toLocaleString();
        plane.querySelector('.rs-wk').textContent=(p.wk!=null?p.wk:'—');
        plane.querySelector('.rs-rate').textContent=p.rate+'%';
        plane.querySelector('.rs-decl-cap').textContent='decline rate · '+p.declines+(p.declines===1?' decline':' declines');
      }
      // trophy hover on the whole module
      plane.addEventListener('mouseenter',function(){plane.classList.add('hovering');});
      plane.addEventListener('mouseleave',function(){plane.classList.remove('hovering');});
    }
  };
})(window.obsInit);
init();
</script>
</body>
</html>
