<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InnerView — Talent Operations Intelligence</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --lawn:#1B8751;--lawn-light:#d4edda;--dusk:#232F46;--plaster:#F0F2F5;--white:#fff;
  --border:#e1e4e8;--text-secondary:#6b7280;--amber:#f59e0b;--red:#ef4444;--zero:#9ca3af;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--plaster);color:var(--dusk);font-size:14px;line-height:1.5}
.header{background:var(--dusk);color:var(--white);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.header-left{display:flex;align-items:center;gap:12px}.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--lawn)}
.report-title{font-size:17px;font-weight:700;letter-spacing:-.3px}.rt-brand{font-weight:800}.rt-desc{font-size:12px;font-weight:400;letter-spacing:.3px;color:rgba(255,255,255,.5);margin-left:7px}.report-meta{font-size:12px;color:rgba(255,255,255,.55);margin-top:1px}
.dept-selector-wrap{display:flex;align-items:center;gap:10px}.dept-label{font-size:12px;color:rgba(255,255,255,.6)}
.dept-select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--white);padding:7px 32px 7px 12px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;appearance:none;min-width:200px}
.dept-select option{background:var(--dusk);color:var(--white)}
.tab-nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 32px;display:flex;gap:0}
.tab-btn{padding:14px 20px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-secondary);border-bottom:2px solid transparent;transition:all .15s}
.tab-btn:hover{color:var(--dusk)}.tab-btn.active{color:var(--lawn);border-bottom-color:var(--lawn);font-weight:600}
.page{padding:28px 32px;max-width:1200px;margin:0 auto}.tab-panel{display:none}.tab-panel.active{display:block}
.stats-grid,.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-bottom:28px}.kpi-3{grid-template-columns:repeat(3,1fr)}.kpi-4{grid-template-columns:repeat(4,1fr)}
.stat-card,.section-card,.kpi,.status-card,.bh-card,.callout-card,.recaction-card,.flag-box,.sla-panel{background:var(--white);border:1px solid var(--border);border-radius:10px}
.stat-card,.kpi{padding:20px}.kpi-alert{border-color:#fecaca;background:#fff7f7}
.stat-value,.metric-big{font-size:28px;font-weight:700;color:var(--dusk);line-height:1;margin-bottom:6px}.metric-big{font-size:32px}
.stat-value.green{color:var(--lawn)}.stat-value.amber{color:#d97706}
.stat-label,.label,.metric-sub{font-size:12px;color:var(--text-secondary);font-weight:500}.label{text-transform:uppercase;letter-spacing:.3px}.metric-sub{margin-top:8px}
.section-card{padding:24px;margin-bottom:20px}.section-title,.section-label{font-size:15px;font-weight:700;color:var(--dusk);margin-bottom:16px}
.section-label{text-transform:uppercase;letter-spacing:.45px;font-size:12px;color:var(--text-secondary)}
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);background:var(--white);margin-bottom:22px}
.data-table,.interviewer-table,.iq-table{border-collapse:collapse;font-size:13px}.data-table th,.interviewer-table th,.iq-table th{text-align:left;background:var(--plaster);color:var(--text-secondary);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap}
.data-table td,.interviewer-table td,.iq-table td{border-bottom:1px solid #f3f4f6;vertical-align:middle}.data-table tr:hover td,.interviewer-table tr:hover td,.iq-table tr:hover td{background:#fafafa}
.score-chip,.iq-chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;min-width:40px;text-align:center}
.score-100{background:#d1fae5;color:#065f46}.score-high{background:#dcfce7;color:#166534}.score-mid{background:#fef3c7;color:#92400e}.score-low{background:#fee2e2;color:#991b1b}.score-zero{background:#f3f4f6;color:#6b7280}.score-null{background:#f9fafb;color:#d1d5db}
.reason-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.reason-pill{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:12px 18px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px}.reason-pill .rp-pct{font-size:22px;font-weight:700;color:var(--dusk)}.reason-pill .rp-label{font-size:11px;color:var(--text-secondary);text-align:center}.reason-pill.top{border-color:var(--lawn)}.reason-pill.top .rp-pct{color:var(--lawn)}
.callout{display:flex;align-items:center;gap:16px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:16px 20px;margin-bottom:20px}.callout-icon{font-size:28px}.callout-value{font-size:22px;font-weight:700;color:var(--lawn)}.callout-label{font-size:12px;color:var(--text-secondary)}.callout.warn{background:#fffbeb;border-color:#fde68a}.callout.warn .callout-value{color:#d97706}
.reason-tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:var(--plaster);color:var(--text-secondary)}.reason-tag.ooo{background:#dbeafe;color:#1d4ed8}.reason-tag.too-many{background:#fee2e2;color:#991b1b}.reason-tag.conflict{background:#fef3c7;color:#92400e}
.empty-state{text-align:center;padding:48px 24px;color:var(--text-secondary)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.status-card{padding:20px;cursor:pointer}.status-card:hover{box-shadow:0 8px 24px rgba(35,47,70,.08);transform:translateY(-1px)}
.status-card-top{display:flex;justify-content:space-between;align-items:center}.status-card h3{font-size:16px}.status-card p{margin:12px 0;color:var(--text-secondary)}
.status-dot{width:12px;height:12px;border-radius:50%}.dot-green{background:var(--lawn)}.dot-amber{background:var(--amber)}.dot-red{background:var(--red)}
.status-badge,.sla-pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;margin-top:10px}.sbadge-green,.sla-pill-green{background:#dcfce7;color:#166534}.sbadge-amber,.sla-pill-warn{background:#fef3c7;color:#92400e}.sbadge-red,.sla-pill-red{background:#fee2e2;color:#991b1b}
.go{font-size:12px;color:var(--lawn);font-weight:700}.divider{height:1px;background:var(--border);margin:28px 0}
.obs-list{list-style:none;display:flex;flex-direction:column;gap:8px}.obs-list li{padding:10px 14px;border-radius:6px;font-size:13px}.obs-list.obs li{background:#f0f9ff;border-left:3px solid #0ea5e9}.obs-list.rec li{background:#f0fdf4;border-left:3px solid var(--lawn)}
.callout-card,.recaction-card{padding:16px 18px;margin-bottom:22px}.callout-item,.recaction-item{padding:9px 0;border-bottom:1px solid #f3f4f6}.callout-item:last-child,.recaction-item:last-child{border-bottom:none}.recaction-arrow{color:var(--lawn);font-weight:800;margin-right:8px}
.sc-group{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;background:white}.sc-group-btn{width:100%;display:flex;justify-content:space-between;padding:12px 14px;border:0;background:#fafafa;font-weight:700;cursor:pointer}.sc-group-count{color:var(--text-secondary);font-weight:500;margin-left:8px}.due-chip{background:#fee2e2;color:#991b1b;border-radius:999px;padding:2px 8px;font-weight:700}
.bh-card{overflow:hidden;margin-bottom:20px}.bh-card-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}.bh-card-title{font-weight:700}.bh-card-meta{font-size:12px;color:var(--text-secondary)}
.iq-count{display:block;font-size:11px;color:var(--text-secondary)}.tip{border-bottom:1px dotted #999;cursor:help}.tip-popup{position:absolute;z-index:999;background:#111827;color:white;font-size:12px;line-height:1.4;padding:8px 10px;border-radius:8px;width:240px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.bh-tip-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:#94a3b8;color:#fff;font-size:9px;font-weight:700;font-style:normal;cursor:help;margin-left:4px;vertical-align:middle;line-height:1;flex-shrink:0}
.bh-tip-icon:hover{background:var(--dusk)}
#bh-global-tooltip{position:fixed;z-index:9999;background:#111827;color:#fff;font-size:12px;line-height:1.5;padding:10px 12px;border-radius:8px;width:230px;box-shadow:0 8px 24px rgba(0,0,0,.28);pointer-events:none;display:none}
.flag-box{padding:16px 18px;background:#fff7ed;border-color:#fed7aa}.flag-header{font-weight:800;color:#9a3412;margin-bottom:8px}.flag-body{font-size:13px;color:#7c2d12}
.role-rate-row{display:grid;grid-template-columns:170px 1fr 52px 100px;align-items:center;gap:10px;margin:10px 0}.role-rate-track{height:18px;border-radius:6px;background:var(--plaster);overflow:hidden}.role-rate-fill-green,.role-rate-fill-amber,.role-rate-fill-red{height:100%;border-radius:6px}.role-rate-fill-green{background:var(--lawn)}.role-rate-fill-amber{background:#fbbf24}.role-rate-fill-red{background:#f87171}.role-rate-pct{text-align:right;font-weight:700}
.timestamp{margin-top:24px;color:var(--text-secondary);font-size:11px}.footer{text-align:center;padding:24px;color:var(--text-secondary);font-size:11px;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){.header{padding:10px 16px;height:auto;gap:12px;flex-direction:column;align-items:flex-start}.tab-nav{padding:0 16px;overflow-x:auto}.page{padding:20px 16px}.two-col,.status-grid,.kpi-3,.kpi-4{grid-template-columns:1fr}.role-rate-row{grid-template-columns:1fr}.role-rate-pct{text-align:left}}
/* BrightHire skill coverage */
.bh-card-desc{padding:14px 18px;font-size:13px;color:var(--text-secondary);line-height:1.6;background:var(--plaster);border-bottom:1px solid var(--border)}
.bh-role-tabs{display:flex;gap:6px;flex-wrap:wrap}
.bh-role-tab{border:1px solid var(--border);background:var(--white);color:var(--text-secondary);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.bh-role-tab.active{background:var(--lawn);border-color:var(--lawn);color:var(--white)}
.bh-role-tab-ghost{border:1px dashed #cfd4dd;background:var(--white);color:#b7bcc5;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:default}
.bh-role-panel{display:none;padding:0 18px 18px}
.bh-role-panel.active{display:block}
.bh-role-meta{font-size:12px;color:var(--text-secondary);margin:14px 0;font-weight:600}
.bh-split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bh-group{border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--white)}
.bh-group-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bh-group-dot{width:9px;height:9px;border-radius:50%}
.bh-group-label{font-size:12px;font-weight:800;color:var(--text-secondary)}
.bh-group-label.green{color:var(--lawn)}
.bh-group-label.gap{color:#92400e}
.bh-row{display:grid;grid-template-columns:minmax(120px,180px) 1fr 42px;align-items:center;gap:10px;margin:10px 0}
.bh-skill-label{font-size:12px;color:var(--dusk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh-track{height:16px;border-radius:999px;background:var(--plaster);overflow:hidden}
.bh-fill-green,.bh-fill-amber,.bh-fill-red{height:100%;border-radius:999px}
.bh-fill-green{background:var(--lawn)}.bh-fill-amber{background:#fbbf24}.bh-fill-red{background:#f87171}
.bh-pct-green,.bh-pct-amber,.bh-pct-red{font-size:12px;font-weight:800;text-align:right}
.bh-pct-green{color:var(--lawn)}.bh-pct-amber{color:#92400e}.bh-pct-red{color:#991b1b}
@media(max-width:768px){.bh-split{grid-template-columns:1fr}.bh-row{grid-template-columns:1fr}.bh-pct-green,.bh-pct-amber,.bh-pct-red{text-align:left}}
/* Scorecard accordion table */
:root{--table-th-padding:6px 8px;--table-td-padding:7px 8px}
.data-table,.interviewer-table,.iq-table{width:100%;border-collapse:collapse;table-layout:auto;font-size:13px}
.data-table th,.interviewer-table th,.iq-table th{padding:var(--table-th-padding)!important;font-size:11px!important;font-weight:600;color:var(--text-secondary);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--plaster);text-transform:uppercase;letter-spacing:.4px}
.data-table td,.interviewer-table td,.iq-table td{padding:var(--table-td-padding)!important;border-bottom:1px solid #f3f4f6;vertical-align:middle}
.sc-accordion{width:760px;max-width:100%}
.sc-group{width:100%!important;max-width:100%;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--white);margin-bottom:12px}
.sc-group-btn{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:12px 14px!important;border:0;background:#fafafa;font-size:15px;font-weight:800;cursor:pointer}
.sc-group-count{color:var(--text-secondary);font-weight:600;margin-left:8px}
.sc-group-body{background:var(--white)}
.sc-table-wrap{display:block!important;width:100%!important;max-width:100%;overflow-x:auto;border:0!important;border-top:1px solid var(--border)!important;border-radius:0!important;background:var(--white);margin:0}
.sc-table{width:100%!important;border-collapse:collapse;table-layout:fixed;font-size:13px}
.sc-table th{padding:7px 10px!important;font-size:11px!important;font-weight:700;color:var(--text-secondary);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--plaster);text-transform:uppercase;letter-spacing:.45px}
.sc-table td{padding:8px 10px!important;border-bottom:1px solid #f3f4f6;vertical-align:middle;white-space:nowrap}
.sc-table th:nth-child(1),.sc-table td:nth-child(1){width:40%}
.sc-table th:nth-child(2),.sc-table td:nth-child(2){width:14%;text-align:right}
.sc-table th:nth-child(3),.sc-table td:nth-child(3){width:22%}
.sc-table th:nth-child(4),.sc-table td:nth-child(4){width:24%;text-align:right}
.sc-table tr:last-child td{border-bottom:none}
.due-chip{display:inline-block;min-width:28px;text-align:center;background:#fee2e2;color:#991b1b;border-radius:999px;padding:2px 8px;font-weight:800}
@media(max-width:820px){.sc-accordion{width:100%}}
/* Section Shell */
.section-shell{position:relative;background:var(--white);border:1px solid #d8dde6;border-left:6px solid var(--lawn);border-radius:16px;overflow:hidden;margin-bottom:28px;box-shadow:0 8px 22px rgba(35,47,70,.07)}
.section-shell-header{padding:18px 22px 16px;border-bottom:1px solid #dfe4ec;background:#ffffff}
.section-shell-title{font-size:13px;font-weight:700;color:var(--dusk);text-transform:uppercase;letter-spacing:.65px;display:flex;align-items:center;gap:8px}
.section-shell-subtitle{margin-top:5px;font-size:12.5px;color:var(--text-secondary);line-height:1.45;max-width:760px}
.section-shell-body{padding:20px 22px 22px;background:#fff}
/* Section accent colors */
.bh-sig-label{border-bottom:1px dotted #9ca3af;cursor:help}
.bh-key-item{position:relative!important}.bh-key-tooltip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1e293b;color:#f1f5f9;font-size:11px;line-height:1.4;padding:6px 10px;border-radius:6px;white-space:normal;width:220px;z-index:100;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}.bh-key-item:hover .bh-key-tooltip{display:block}
/* "What to know" and "Insights and recommendations" — navy header treatment, bookends each tab */
.section-shell[data-section*="What to know"],.section-shell[data-section*="Insights and recommendations"]{border-left:6px solid #232F46!important}
.section-shell[data-section*="What to know"] .section-shell-header,.section-shell[data-section*="Insights and recommendations"] .section-shell-header{background:#232F46!important;border-bottom:none!important;padding:15px 22px!important}
.section-shell[data-section*="What to know"] .section-shell-title,.section-shell[data-section*="Insights and recommendations"] .section-shell-title{color:#ffffff!important;letter-spacing:.7px!important;font-size:12px!important}
.section-shell[data-section*="What to know"] .section-shell-title::before,.section-shell[data-section*="Insights and recommendations"] .section-shell-title::before{display:none!important}
.section-shell[data-section*="What to know"] .section-shell-subtitle,.section-shell[data-section*="Insights and recommendations"] .section-shell-subtitle{color:rgba(255,255,255,.55)!important;margin-top:4px!important}
.section-shell[data-section="Scorecard performance"]{border-left-color:#974859!important}
.section-shell[data-section="Scorecard performance"] .section-shell-title::before{content:"✓";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#974859;color:white;font-size:12px;font-weight:900}
.section-shell[data-section*="Interview quality"],.section-shell[data-section*="quality"]{border-left-color:#85AFCC!important}
.section-shell[data-section*="Interview quality"] .section-shell-title::before,.section-shell[data-section*="quality"] .section-shell-title::before{content:"◇";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#85AFCC;color:white;font-size:12px;font-weight:900}
.section-shell[data-section*="Interview skill"],.section-shell[data-section*="skill"]{border-left-color:#BA6029!important}
.section-shell[data-section*="Interview skill"] .section-shell-title::before,.section-shell[data-section*="skill"] .section-shell-title::before{content:"◆";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#BA6029;color:white;font-size:10px;font-weight:900}
/* "Recommended" kept for legacy compatibility — new name is "What to do" above */
.section-shell[data-section="Decline summary"]{border-left-color:#974859!important}
.section-shell[data-section="Decline summary"] .section-shell-title::before{content:"↓";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#974859;color:white;font-size:12px;font-weight:900}
.section-shell[data-section="High decline flags"]{border-left-color:#CCA5A3!important}
.section-shell[data-section="High decline flags"] .section-shell-title::before{content:"⚑";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#CCA5A3;color:#5a1f1f;font-size:12px;font-weight:900}
.section-shell[data-section="Decline reasons"]{border-left-color:#85AFCC!important}
.section-shell[data-section="Decline reasons"] .section-shell-title::before{content:"⊘";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#85AFCC;color:white;font-size:12px;font-weight:900}
.section-shell[data-section="Declines by interviewer"]{border-left-color:#85AFCC!important}
.section-shell[data-section="Declines by interviewer"] .section-shell-title::before{content:"≡";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#85AFCC;color:white;font-size:12px;font-weight:900}
.section-shell[data-section="Coordination load"]{border-left-color:#BA6029!important}
.section-shell[data-section="Coordination load"] .section-shell-title::before{content:"⟳";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#BA6029;color:white;font-size:12px;font-weight:900}
/* "What to know" items — clean rows, amber left strip only, no nested boxes */
.section-shell[data-section*="What to know"] .callout-card{display:flex!important;flex-direction:column!important;gap:0!important;background:transparent!important;border:none!important;padding:0!important;border-radius:0!important}
.section-shell[data-section*="What to know"] .callout-item{display:flex!important;align-items:center!important;gap:12px!important;background:transparent!important;border:none!important;border-bottom:1px solid #f3f4f6!important;border-radius:0!important;padding:12px 14px!important;font-size:14px!important;font-weight:500!important;line-height:1.5!important;color:#232F46!important;box-shadow:none!important}
.section-shell[data-section*="What to know"] .callout-item:last-child{border-bottom:none!important}
.section-shell[data-section*="What to know"] .callout-item::before{content:"!"!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;width:20px!important;height:20px!important;min-width:20px!important;border-radius:50%!important;background:#F6BF56!important;color:#5a3b00!important;font-weight:800!important;font-size:12px!important;line-height:1!important;position:static!important;flex-shrink:0!important}
/* "Insights and recommendations" items — clean rows, green left strip only, no nested boxes */
.section-shell[data-section*="Insights and recommendations"] .recaction-card{background:transparent!important;border:none!important;padding:0!important;border-radius:0!important}
.section-shell[data-section*="Insights and recommendations"] .recaction-item{display:flex!important;align-items:center!important;background:transparent!important;border:none!important;border-bottom:1px solid #f3f4f6!important;border-radius:0!important;padding:12px 14px!important;margin-bottom:0!important}
.section-shell[data-section*="Insights and recommendations"] .recaction-item:last-child{border-bottom:none!important}
/* Table styling inside shells */
.section-shell .table-wrap,.section-shell .sc-table-wrap,.section-shell .sla-panel,.section-shell .bh-card{background:#ffffff!important;border:1px solid #d1d9e6!important;border-radius:10px!important;overflow:hidden!important;box-shadow:none!important}
.section-shell table th,.section-shell .data-table th,.section-shell .interviewer-table th,.section-shell .iq-table th,.section-shell .sc-table th{background:#f5f7fa!important;color:#6b7280!important;border-bottom:1px solid #d1d9e6!important}
.section-shell table td,.section-shell .data-table td,.section-shell .interviewer-table td,.section-shell .iq-table td,.section-shell .sc-table td{background:#ffffff!important;border-bottom:1px solid #eef2f7!important}

.section-shell .sc-group{border:1px solid #d1d9e6!important;border-radius:10px!important;box-shadow:none!important;background:#ffffff!important}

/* Semantic color palette: Green=#ADD9B8, Red=#CCA5A3, Yellow=#F6BF56 */
.score-100,.score-high{background:#ADD9B8!important;color:#1f3b2b!important}
.score-mid{background:#F6BF56!important;color:#5a3b00!important}
.score-low{background:#CCA5A3!important;color:#5a1f1f!important}
.score-zero,.score-null{background:#f3f4f6!important;color:#6b7280!important}
.bar-fill,.role-rate-fill-green,.bh-fill-green{background:#ADD9B8!important}
.bar-fill.decline,.role-rate-fill-amber,.bh-fill-amber{background:#F6BF56!important}
.role-rate-fill-red,.bh-fill-red{background:#CCA5A3!important}
.sbadge-green,.sla-pill-green,.status-badge.sbadge-green{background:#ADD9B8!important;color:#1f3b2b!important}
.sbadge-amber,.sla-pill-warn,.status-badge.sbadge-amber{background:#F6BF56!important;color:#5a3b00!important}
.sbadge-red,.sla-pill-red,.status-badge.sbadge-red{background:#CCA5A3!important;color:#5a1f1f!important}
.dot-green{background:#ADD9B8!important}.dot-amber{background:#F6BF56!important}.dot-red{background:#CCA5A3!important}
.due-chip{background:#CCA5A3!important;color:#5a1f1f!important}
/* Accordion button normalization */
.sc-group-btn,.sc-group-btn *{font-weight:400!important;letter-spacing:0!important}
.sc-group-btn{font-size:14px!important;line-height:1.35!important;color:#232F46!important;background:#ffffff!important;padding:13px 16px!important}
.sc-group-count{font-size:13px!important;font-weight:400!important;color:#6b7280!important}
.sc-arrow{font-size:12px!important;color:#6b7280!important}
.sc-group{border-color:#d8dee8!important}
.sc-group-btn:hover{background:#f8fafc!important}
/* KPI grid inside section shells */
.section-shell .kpi{background:#fbfcfd!important;border:1px solid #dbe1ea!important;border-radius:10px!important;padding:20px!important;box-shadow:none!important}
.section-shell .label{font-size:12px!important;font-weight:600!important;color:#6b7280!important;text-transform:uppercase!important;letter-spacing:.4px!important;margin-bottom:10px!important}
.section-shell .metric-big{font-size:32px!important;font-weight:700!important;color:#232F46!important;line-height:1!important;margin-bottom:8px!important}
.section-shell .metric-sub{font-size:12px!important;color:#6b7280!important;font-weight:400!important;line-height:1.35!important}
/* Typography normalization */
html,body,button,input,select,textarea,table,th,td,div,span,p,a,label,section,header,footer,main,nav,option{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif!important;
}
body{font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.section-shell-title,.report-title,.section-title,.bh-card-title,.stat-value,.metric-big{font-weight:700!important}
.section-shell-subtitle,.report-meta,.metric-sub,.stat-label,.bh-card-meta,.iq-count{font-weight:400!important}
table th{font-weight:600!important}table td{font-weight:400!important}
.sla-pill,.score-chip,.iq-chip,.status-badge,.reason-tag,.due-chip{font-weight:700!important}
/* Summary tab section accents */
.section-shell[data-section="Quarter at a glance"]{border-left-color:#232F46!important}
.section-shell[data-section="Quarter at a glance"] .section-shell-title::before{content:"◉";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#232F46;color:white;font-size:11px;font-weight:900}
.section-shell[data-section="Highest activity interviewers"]{border-left-color:#1B8751!important}
.section-shell[data-section="Highest activity interviewers"] .section-shell-title::before{content:"★";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#1B8751;color:white;font-size:11px;font-weight:900}
.section-shell[data-section="Flagged interviewers"]{border-left-color:#CCA5A3!important}
.section-shell[data-section="Flagged interviewers"] .section-shell-title::before{content:"⚑";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#CCA5A3;color:#5a1f1f;font-size:12px;font-weight:900}
/* Roles section — status-colored collapsible group headers (match the summary pills) */
.roles-grp-filled .sc-group-btn{background:#ADD9B8!important;color:#1f3b2b!important}
.roles-grp-filled .sc-group-btn:hover{background:#9ccfa9!important}
.roles-grp-filled .sc-arrow{color:#1f3b2b!important}
.roles-grp-closed .sc-group-btn{background:#e5e7eb!important;color:#374151!important}
.roles-grp-closed .sc-group-btn:hover{background:#d8dbe0!important}
.roles-grp-closed .sc-arrow{color:#374151!important}
.roles-grp-open .sc-group-btn{background:#dbeafe!important;color:#1e40af!important}
.roles-grp-open .sc-group-btn:hover{background:#c8dffc!important}
.roles-grp-open .sc-arrow{color:#1e40af!important}
.roles-grp-other .sc-group-btn{background:#FDF3DC!important;color:#5a3b00!important}
.roles-grp-other .sc-group-btn:hover{background:#f8ead0!important}
.roles-grp-other .sc-arrow{color:#5a3b00!important}
/* Placeholder note */
.placeholder-note{color:#6b7280;font-size:13px;font-style:italic;padding:4px 0}

/* ════════════════════════════════════════════════════════════════
   DASHBOARD HUB THEME — whole-report visual lift (override layer)
   Applies to every department page and all three tabs via shared classes.
   ════════════════════════════════════════════════════════════════ */
body{background:linear-gradient(180deg,#e8ecf3 0%,#eef1f5 100%)!important;background-attachment:fixed!important}

/* Header — deeper chrome, subtle gradient, refined */
.header{background:linear-gradient(120deg,#232F46 0%,#2b3a56 100%)!important;box-shadow:0 4px 20px rgba(35,47,70,.28)!important;border-bottom:1px solid rgba(255,255,255,.06)!important}
.logo-dot{box-shadow:0 0 0 0 rgba(27,135,81,.6);animation:hubPulse 2.6s ease-out infinite}
@keyframes hubPulse{0%{box-shadow:0 0 0 0 rgba(27,135,81,.5)}70%{box-shadow:0 0 0 7px rgba(27,135,81,0)}100%{box-shadow:0 0 0 0 rgba(27,135,81,0)}}

/* Tab nav — becomes a rail attached to the header chrome */
.tab-nav{background:#2c3a54!important;border-bottom:none!important;box-shadow:0 2px 10px rgba(35,47,70,.15)!important;padding:0 32px!important}
.tab-btn{color:#8a97b5!important}
.tab-btn:hover{color:#dfe6f2!important}
.tab-btn.active{color:#fff!important;border-bottom-color:#3ec99a!important}

/* Page canvas */
.page{max-width:1240px!important}

/* Elevated cards — directional shadow, rounder, hover lift */
.stat-card,.section-card,.kpi,.status-card,.bh-card,.callout-card,.recaction-card,.sla-panel,.section-shell{
  border-radius:16px!important;
  border:0.5px solid #e3e8f0!important;
  box-shadow:0 2px 4px rgba(35,47,70,.05),0 12px 26px -8px rgba(35,47,70,.13)!important;
  transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s ease!important;
}
.stat-card:hover,.section-shell:hover{
  transform:translateY(-2px)!important;
  box-shadow:0 4px 8px rgba(35,47,70,.07),0 18px 38px -10px rgba(35,47,70,.2)!important;
}
/* Section shells keep their colored left spine but gain the lift */
.section-shell{overflow:hidden!important}
.section-shell-header{background:linear-gradient(180deg,#ffffff,#fbfcfe)!important}

/* KPI stat cards — top accent + inset panel feel */
.stat-card{background:#fff!important;position:relative!important}

/* Tables inside cards read as inset panels */
.section-shell .table-wrap,.section-shell .sc-table-wrap{border-radius:12px!important;border:0.5px solid #e3e8f0!important;background:#f9fafc!important}

/* Section fade-in on render */
.tab-panel.active > .section-shell,.tab-panel.active > section{animation:hubFade .5s ease both}
.tab-panel.active > .section-shell:nth-child(1){animation-delay:.02s}
.tab-panel.active > .section-shell:nth-child(2){animation-delay:.08s}
.tab-panel.active > .section-shell:nth-child(3){animation-delay:.14s}
.tab-panel.active > .section-shell:nth-child(4){animation-delay:.20s}
.tab-panel.active > .section-shell:nth-child(5){animation-delay:.26s}
@keyframes hubFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Bars animate width on load (coaching/skills/concentration) */
@keyframes hubBar{from{width:0!important}}

/* Reduce motion for accessibility */
@media(prefers-reduced-motion:reduce){
  .logo-dot,.tab-panel.active > .section-shell,.tab-panel.active > section{animation:none!important}
  .stat-card,.section-shell{transition:none!important}
}

/* ── Hub KPI tiles: icon chips ── */
.hub-tile{position:relative!important}
.hub-chip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;margin-bottom:11px;line-height:1}
/* AI glow tile — gradient block that pops forward */
.hub-tile-ai{background:linear-gradient(155deg,#3c3489 0%,#534ab7 100%)!important;border:0.5px solid #4a42a3!important;overflow:hidden!important;box-shadow:0 2px 4px rgba(60,52,137,.22),0 14px 30px -8px rgba(60,52,137,.45)!important}
.hub-tile-ai:hover{box-shadow:0 4px 10px rgba(60,52,137,.3),0 22px 46px -10px rgba(60,52,137,.6)!important}
.hub-tile-ai .stat-value{color:#fff!important}
.hub-tile-ai-glow{position:absolute;top:-34px;right:-34px;width:110px;height:110px;background:radial-gradient(circle,rgba(207,203,246,.45),transparent 68%);border-radius:50%;pointer-events:none}
/* Light indigo glow tile (Interviews completed) */
.hub-tile-indigo{background:linear-gradient(160deg,#f2f1fb 0%,#e6e4f6 100%)!important;border:0.5px solid #cfcbec!important;overflow:hidden!important;box-shadow:0 2px 4px rgba(90,79,196,.08),0 12px 26px -8px rgba(90,79,196,.2)!important}
.hub-tile-indigo:hover{box-shadow:0 4px 8px rgba(90,79,196,.12),0 18px 38px -10px rgba(90,79,196,.28)!important}
.hub-tile-indigo-glow{position:absolute;top:-30px;right:-30px;width:100px;height:100px;background:radial-gradient(circle,rgba(124,113,221,.28),transparent 70%);border-radius:50%;pointer-events:none}
.hub-tile-indigo .hub-chip{box-shadow:0 1px 3px rgba(90,79,196,.2)}

/* ── Accent spine bars on section-shell titles (colored vertical tick) ── */
.section-shell .section-shell-title{display:flex;align-items:center;gap:9px}
.section-shell .section-shell-title::after{content:"";display:none}
.section-shell-title{position:relative}
.section-shell .section-shell-header{position:relative}
.section-shell .section-shell-header::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:5px;border-radius:0 3px 3px 0;background:var(--lawn)}
.section-shell[data-section*="health"] .section-shell-header::before,
.section-shell[data-section*="watch"] .section-shell-header::before{background:#d85a30}
.section-shell[data-section*="rigor"] .section-shell-header::before,
.section-shell[data-section*="quality"] .section-shell-header::before,
.section-shell[data-section*="skill"] .section-shell-header::before{background:#85AFCC}
.section-shell[data-section*="Coaching"] .section-shell-header::before,
.section-shell[data-section*="coaching"] .section-shell-header::before{background:#BA6029}
.section-shell[data-section*="Scorecard"] .section-shell-header::before{background:#974859}
.section-shell[data-section*="Roles"] .section-shell-header::before{background:#232F46}
.section-shell[data-section*="Coordination"] .section-shell-header::before{background:#BA6029}
.section-shell[data-section*="decline"] .section-shell-header::before{background:#974859}
.section-shell .section-shell-header{padding-left:26px!important}

/* ════════════════════════════════════════════════════════════════
   FULL RE-THEME — deep section-body styling (reaches inside every render fn
   via shared inner classes: tables, mini-panels, bars, chips, accordions)
   ════════════════════════════════════════════════════════════════ */

/* Data tables → soft inset panels with rounded rows */
.section-shell .table-wrap,.section-shell .sc-table-wrap,.section-shell .sc-accordion{
  border-radius:12px!important;border:0.5px solid #e3e8f0!important;background:#fafbfd!important;
  box-shadow:inset 0 1px 2px rgba(35,47,70,.03)!important;overflow:hidden!important;
}
.section-shell table thead th,.section-shell .sc-table thead th{
  background:#f2f5f9!important;color:#5a6a85!important;font-size:10.5px!important;
  letter-spacing:.5px!important;border-bottom:1px solid #e3e8f0!important;
}
.section-shell table tbody td{border-bottom:1px solid #eef2f7!important}
.section-shell table tbody tr:hover td{background:#f4f8fc!important}
.section-shell table tbody tr:last-child td{border-bottom:none!important}

/* Inline mini-stat panels (load balance KPIs, decline mini-cards, etc.) */
.section-shell .kpi{background:linear-gradient(160deg,#fbfcfe,#f5f8fc)!important;border:0.5px solid #e3e8f0!important;border-radius:13px!important;box-shadow:0 1px 3px rgba(35,47,70,.04)!important}

/* Progress bars — rounded, subtle gradient, animate in */
.section-shell .role-rate-track,.section-shell .bh-track,.section-shell [style*="background:#eef1f5"],.section-shell [style*="background:#e5e7eb"]{border-radius:5px!important}
.role-rate-fill-green,.bh-fill-green{background:linear-gradient(90deg,#1b8751,#3ec99a)!important;border-radius:5px!important}
.role-rate-fill-amber,.bh-fill-amber{background:linear-gradient(90deg,#ba7517,#f6bf56)!important;border-radius:5px!important}
.role-rate-fill-red,.bh-fill-red{background:linear-gradient(90deg,#974859,#cca5a3)!important;border-radius:5px!important}

/* Score chips / pills — pill shape, slight depth */
.score-chip,.iq-chip,.sla-pill,.reason-tag,.due-chip,.status-badge{border-radius:999px!important;box-shadow:0 1px 2px rgba(35,47,70,.06)!important;font-weight:700!important}

/* Accordion groups (scorecard, roles) → cards */
.section-shell .sc-group{border-radius:12px!important;border:0.5px solid #e3e8f0!important;box-shadow:0 1px 3px rgba(35,47,70,.05)!important;overflow:hidden!important;transition:box-shadow .18s ease}
.section-shell .sc-group:hover{box-shadow:0 4px 12px rgba(35,47,70,.09)!important}
.section-shell .sc-group-btn{background:linear-gradient(180deg,#ffffff,#fafbfd)!important}
.section-shell .sc-group-btn:hover{background:#f4f8fc!important}

/* BrightHire skill role tabs → pill toggle */
.bh-role-tab{border-radius:999px!important;transition:all .15s ease}
.bh-role-tab.active{background:var(--lawn)!important;box-shadow:0 2px 6px rgba(27,135,81,.3)!important}

/* Callout / recommendation cards inside shells → soft tinted panels */
.section-shell .callout-item{border-radius:9px!important}
.section-shell .recaction-item{transition:background .15s ease}

/* Level-panel collapsibles (load by level) → cards */
.lp-body,[class*="lp-"]{border-radius:0 0 10px 10px!important}

/* Empty-state polish */
.empty-state{background:#fafbfd!important;border-radius:12px!important}

/* ── Dark intelligence hero band (All Departments) ── */
.all-dept-shell{overflow:hidden!important}
.hero-band{position:relative;background:linear-gradient(120deg,#161d33 0%,#1c2542 55%,#241d4a 100%);padding:24px 26px 28px;overflow:hidden}
.hero-band-glow{position:absolute;top:-80px;right:-40px;width:420px;height:320px;background:radial-gradient(ellipse,rgba(140,90,230,.28),transparent 65%);pointer-events:none}
.hero-card{position:relative;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px 22px;overflow:hidden;backdrop-filter:blur(4px)}
.hero-card-glow{position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:radial-gradient(circle,rgba(90,120,220,.2),transparent 70%);border-radius:50%;pointer-events:none}
.hero-band .stat-value{margin:0}
.ai-gauge-ring{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.3,1)}

/* ── Mid-tone signals body (All Departments middle band) — dimmed, not full dark ── */
.dark-body{background:linear-gradient(180deg,#4d5573 0%,#5c6488 50%,#6b7396 100%);margin:0}
.all-dept-shell{border:none!important}
.dsig-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.dsig-card.sig-positive{background:linear-gradient(135deg,rgba(60,150,110,.28),rgba(70,120,110,.16));border-color:rgba(120,220,180,.28)}
.dsig-card.sig-attention{background:linear-gradient(135deg,rgba(150,95,60,.24),rgba(110,90,120,.16));border-color:rgba(230,150,120,.26)}
/* Signal filter tabs */
.sig-tab{border:none;background:none;color:#c2cae0;font-size:12px;font-weight:600;padding:6px 14px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;transition:all .15s ease}
.sig-tab.active{background:rgba(255,255,255,.18);color:#fff}
.sig-tab:hover:not(.active){color:#fff}

/* Attention-only mode: dim the non-attention parts, spotlight the focus parts */
.attention-mode .att-dim{opacity:.32;filter:saturate(.5);transition:opacity .25s ease,filter .25s ease}
.att-dim{transition:opacity .25s ease,filter .25s ease}
.attention-mode .att-focus{background:rgba(224,133,122,.12);box-shadow:0 0 0 1px rgba(224,133,122,.35),0 6px 18px -6px rgba(224,133,122,.3);padding:12px;transition:all .25s ease}
.att-focus{transition:all .25s ease;padding:0}
/* When attention mode is on, fade the whole Positive Signals strip too */
.attention-mode #sig-positive-zone{opacity:.32;filter:saturate(.5);transition:opacity .25s ease,filter .25s ease}
#sig-positive-zone{transition:opacity .25s ease,filter .25s ease}
/* Right column last card (coaching) grows to bottom-align with the taller left column */
.att-col-right > *:last-child{flex:1 1 auto}
.att-col-left > *:last-child{flex:1 1 auto}

/* ── Living-system effects (restrained) ── */
/* One-time scan shimmer across cards on load */
@keyframes lsScanSweep{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.ls-scan{position:relative;overflow:hidden}
.ls-scan::after{content:"";position:absolute;top:0;left:0;height:100%;width:35%;background:linear-gradient(90deg,transparent,rgba(159,178,232,.18),transparent);transform:translateX(-120%);pointer-events:none;z-index:2}
.ls-scan.ls-run::after{animation:lsScanSweep 1.1s ease-out forwards}
/* Cross-fade when content changes (department / filter switch) */
@keyframes lsFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ls-fade{animation:lsFadeIn .38s ease both}
@media(prefers-reduced-motion:reduce){.ls-scan.ls-run::after{animation:none}.ls-fade{animation:none}}

/* ── Card hover: subtle scale (option 3), applied consistently ── */
.dsig-card,.hero-card,.ranked-band{transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease}
.dsig-card:hover,.hero-card:hover{transform:scale(1.015);box-shadow:0 14px 34px -14px rgba(0,0,0,.5)}
@media(prefers-reduced-motion:reduce){.dsig-card:hover,.hero-card:hover{transform:none}}
/* Clickable row hover cues */
.rigor-row:hover,.watch-row:hover{background:rgba(255,255,255,.08)}
.rigor-row,.watch-row{transition:background .15s ease}
/* Watch decline rows — agentic hover: lift + glow intensify + bloom + chevron nudge */
.watch-decl-row:hover{transform:translateY(-4px)!important}
.watch-decl-row.wdr-amber:hover{border-color:rgba(220,160,80,1)!important;box-shadow:0 1px 0 rgba(255,250,235,.95) inset,0 22px 44px -14px rgba(180,120,30,.55),0 0 0 1px rgba(230,180,110,.5),0 0 26px -4px rgba(245,190,90,.5)!important}
.watch-decl-row.wdr-rose:hover{border-color:rgba(220,130,150,1)!important;box-shadow:0 1px 0 rgba(255,246,247,.95) inset,0 22px 44px -14px rgba(160,50,70,.55),0 0 0 1px rgba(224,150,165,.5),0 0 26px -4px rgba(230,120,140,.5)!important}
.watch-decl-row:hover .wdr-bloom{opacity:1!important}
.watch-decl-row:hover .wdr-chev{transform:translateX(3px)}
@media(prefers-reduced-motion:reduce){.watch-decl-row:hover{transform:none!important}}
/* Decline overview cards — defined, agentic hover with indigo glow */
.decl-ov-card:hover{transform:translateY(-4px)!important;border-color:rgba(150,140,235,.9)!important;box-shadow:0 1px 0 rgba(255,255,255,1) inset,0 22px 44px -14px rgba(70,55,140,.42),0 0 0 1px rgba(150,130,240,.4),0 0 26px -6px rgba(140,120,235,.4)!important}
.decl-ov-card:hover .decl-ov-bloom{opacity:1.4;filter:brightness(1.3)}
@media(prefers-reduced-motion:reduce){.decl-ov-card:hover{transform:none!important}}

/* ══ Decline Behavior — composed intelligence surface (premium AI-native) ══ */
/* One frosted surface holding both metrics, no boxes */
.decl-surface{background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(250,250,254,.5));border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:22px 26px;margin-bottom:22px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 14px 34px -18px rgba(70,60,120,.3)}
.decl-ov{display:flex;align-items:center;gap:34px}
.decl-ov-primary,.decl-ov-secondary{display:flex;align-items:baseline;gap:14px}
.decl-ov-num{font-size:38px;font-weight:700;letter-spacing:-1px;line-height:.9;color:var(--dusk);text-shadow:0 2px 20px rgba(70,60,120,.14)}
.decl-ov-num2{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:.9;color:var(--dusk)}
.decl-ov-of{font-size:15px;font-weight:500;color:var(--text-muted);margin-left:6px;letter-spacing:0}
.decl-ov-cap{display:flex;flex-direction:column;gap:3px}
.decl-ov-lbl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#5a5f7a}
.decl-ov-sub{font-size:12px;color:var(--text-muted)}
.decl-ov-div{width:1px;align-self:stretch;background:linear-gradient(180deg,transparent,rgba(120,110,170,.28),transparent);margin:2px 0}
/* Ambient InnerView READ line */
.iv-read{display:flex;align-items:center;gap:12px;margin-top:20px;padding:11px 15px;border-radius:12px;background:linear-gradient(120deg,rgba(140,110,240,.12),rgba(120,100,230,.05));border:1px solid rgba(150,120,240,.22);box-shadow:0 0 24px -10px rgba(140,110,240,.4) inset}
.iv-read-badge{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;font-size:12px;color:#7c5fd6;background:rgba(150,120,240,.16);border:1px solid rgba(160,130,245,.4);border-radius:50%;box-shadow:0 0 12px -2px rgba(140,110,240,.5)}
.iv-read-text{font-size:12.5px;color:#4a4570;line-height:1.4}
/* Watch signals head */
.sig-head{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#5a5f7a;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sig-head-hint{font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--text-muted)}
.sig-list{display:flex;flex-direction:column;gap:12px}
.sig-block{border-radius:16px;overflow:hidden;transition:box-shadow .3s ease,transform .3s cubic-bezier(.2,.7,.3,1)}
/* Signal tile — light emanating, not paint on a box */
.sig-tile{position:relative;display:flex;align-items:center;gap:20px;padding:16px 20px;cursor:pointer;border-radius:16px;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.28));border:1px solid rgba(255,255,255,.6);
  transition:transform .28s cubic-bezier(.2,.7,.3,1),box-shadow .28s ease,border-color .28s ease}
.sig-tile::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;opacity:.9;
  background:radial-gradient(ellipse 60% 120% at 6% 50%,var(--glow),transparent 60%)}
.sig-amber{--accent:#c07a1a;--glow:rgba(240,180,80,.22);--halo:rgba(240,180,80,.5)}
.sig-rose{--accent:#b03050;--glow:rgba(225,120,150,.2);--halo:rgba(225,120,150,.5)}
.sig-berry{--accent:#a83a63;--glow:rgba(215,100,140,.2);--halo:rgba(215,100,140,.5)}
.sig-tile>*{position:relative}
.sig-num{font-size:28px;font-weight:700;letter-spacing:-.8px;line-height:1;color:var(--accent);min-width:56px;text-shadow:0 2px 16px var(--glow)}
.sig-meta{flex:1}
.sig-label{font-size:14.5px;font-weight:700;color:var(--dusk)}
.sig-window{font-size:12px;font-weight:500;color:var(--text-muted)}
.sig-sub{font-size:12px;color:var(--text-secondary);margin-top:2px}
.sig-chev{font-size:20px;color:var(--accent);flex-shrink:0;transition:transform .25s ease;opacity:.7}
/* Hover / selected — tile lifts, glow blooms */
.sig-tile:hover,.sig-tile:focus{transform:translateY(-3px);border-color:var(--halo);outline:none;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 20px 40px -16px rgba(70,55,120,.4),0 0 28px -6px var(--halo)}
.sig-tile:hover .sig-chev{transform:translateX(3px);opacity:1}
.sig-block.open .sig-tile{transform:translateY(-2px);border-color:var(--halo);border-bottom-left-radius:0;border-bottom-right-radius:0;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 -2px 20px -8px var(--halo)}
.sig-block.open .sig-chev{transform:rotate(90deg);opacity:1}
/* Investigation drawer — deeper frosted layer */
.sig-drawer{overflow:hidden;background:linear-gradient(180deg,rgba(46,42,78,.94),rgba(34,32,62,.94));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--halo);border-top:none;border-radius:0 0 16px 16px;box-shadow:0 20px 44px -18px rgba(30,25,70,.55)}
.sig-drawer-inner{padding:16px 22px 18px}
.sig-drawer-label{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#b9b0e8;margin-bottom:12px}
.sig-who-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(150,130,240,.14)}
.sig-who-row:last-of-type{border-bottom:none}
.sig-who-name{font-size:13px;color:#eae7f7}
.sig-who-val{font-size:14px;font-weight:800}
.sig-who-more{color:#9a94c4;font-style:italic;font-size:12px}
.sig-who-more span{color:#9a94c4}
.sig-drawer-meta{font-size:10px;color:#8882b0;font-style:italic;margin-top:10px}
@media(prefers-reduced-motion:reduce){.sig-tile:hover{transform:none}}

/* ══════════════════ OBSERVATORY (Interview Metrics only) ══════════════════ */
#tab-metrics{background:transparent!important;padding:0!important;border-radius:0!important}
.obs-env{position:relative;overflow:hidden;border-radius:20px;padding:20px 28px 48px;
  background:radial-gradient(ellipse at 50% 35%,transparent 42%,rgba(6,8,24,.55) 100%),linear-gradient(170deg,#12152E 0%,#1F2450 34%,#333A6E 70%,#434A82 100%);
  box-shadow:0 60px 120px -50px rgba(10,12,40,.7);
  --nd-fg-secondary:#CDD4E6;color:#F0F2F5;font-feature-settings:"tnum" 1}
/* background layers (z0) — big saturated blooms so blur has something to read */
.obs-bloom-layer,.obs-grid-layer,.obs-colguide,.obs-pointer-light{position:absolute;inset:0;pointer-events:none;z-index:0}
.obs-bloom{position:absolute;border-radius:50%;filter:blur(44px)}
.b-violet-top{width:900px;height:680px;top:-240px;left:46%;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(140,120,255,.34),transparent 64%)}
.b-rose{width:760px;height:700px;top:120px;left:-200px;background:radial-gradient(ellipse at center,rgba(255,80,110,.26),transparent 64%)}
.b-rose2{width:600px;height:540px;top:360px;left:-60px;background:radial-gradient(ellipse at center,rgba(240,140,165,.22),transparent 64%)}
.b-amber{width:680px;height:620px;top:-40px;right:-160px;background:radial-gradient(ellipse at center,rgba(246,191,86,.22),transparent 64%)}
.b-aqua{width:780px;height:700px;bottom:-200px;right:-140px;background:radial-gradient(ellipse at center,rgba(60,210,140,.26),transparent 64%)}
.b-violet-low{width:820px;height:600px;bottom:-220px;left:50%;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(160,120,255,.24),transparent 64%)}
.obs-grid-layer{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:96px 96px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 75%);transform:translate3d(calc(var(--mx,0)*-8px),calc(var(--my,0)*-6px),0);transition:transform .3s cubic-bezier(.2,0,0,1)}
.obs-bloom-layer{transform:translate3d(calc(var(--mx,0)*-26px),calc(var(--my,0)*-18px),0);transition:transform .3s cubic-bezier(.2,0,0,1)}
.obs-colguide{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0,rgba(255,255,255,.045) 1px,transparent 1px,transparent calc(100%/12));-webkit-mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent)}
.obs-pointer-light{opacity:var(--go,0);transition:opacity .3s ease;background:radial-gradient(700px circle at calc(50% + var(--mx,0)*40%) calc(40% + var(--my,0)*40%),rgba(190,180,255,.12),transparent 60%)}
.obs-content{position:relative;z-index:1;padding:8px}
.obs-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;align-items:start}
.obs-col{display:flex;flex-direction:column;gap:52px;min-width:0}
.obs-col-left > .obs-plane{margin-bottom:0}
@media(max-width:920px){.obs-cols{grid-template-columns:1fr}.obs-col{gap:48px}}

/* ── PARENT MODULE (clear glass, overflow visible so offsets overhang) ── */
.obs-plane{position:relative;overflow:visible;border-radius:14px;padding:30px 30px 34px;
  border:.5px solid rgba(255,255,255,.18);
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.42),0 30px 60px -36px rgba(4,5,18,.85)}
.obs-plane.tone-rose{background:linear-gradient(160deg,rgba(255,120,150,.10),rgba(255,120,150,.03))}
.obs-plane.tone-amber{background:linear-gradient(160deg,rgba(246,191,86,.10),rgba(246,191,86,.03))}
.obs-plane.tone-aqua{background:linear-gradient(160deg,rgba(60,210,140,.10),rgba(60,210,140,.03))}
/* clipped decoration child */
.obs-plane-fx{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.obs-plane > *{position:relative;z-index:1}
.obs-plane-fx .obs-spec{position:absolute;inset:0;opacity:var(--go,0);transition:opacity .25s ease;background:radial-gradient(400px circle at var(--gx,50%) var(--gy,-400px),rgba(255,255,255,.08),transparent 60%)}
.tone-rose .obs-plane-fx{background:radial-gradient(460px circle at 85% 0%,rgba(255,80,110,.12),transparent 62%)}
.tone-amber .obs-plane-fx{background:radial-gradient(460px circle at 85% 0%,rgba(246,191,86,.10),transparent 62%)}
.tone-aqua .obs-plane-fx{background:radial-gradient(460px circle at 85% 0%,rgba(60,210,140,.12),transparent 62%)}
/* 1px top-edge light on every module */
.obs-plane-edge{position:absolute;top:0;left:20px;right:20px;height:1px;pointer-events:none;z-index:2}
.tone-rose .obs-plane-edge{background:linear-gradient(90deg,transparent,rgba(247,140,165,.5) 22%,rgba(255,255,255,.85) 50%,rgba(130,170,255,.5) 78%,transparent)}
.tone-amber .obs-plane-edge{background:linear-gradient(90deg,transparent,rgba(246,191,86,.55) 22%,rgba(255,255,255,.85) 50%,rgba(130,170,255,.5) 78%,transparent)}
.tone-aqua .obs-plane-edge{background:linear-gradient(90deg,transparent,rgba(60,210,140,.5) 22%,rgba(255,255,255,.85) 50%,rgba(130,170,255,.5) 78%,transparent)}
/* corner registration marks (need overflow visible) */
.obs-corner{position:absolute;width:9px;height:9px;pointer-events:none;z-index:2;opacity:.5}
.obs-corner::before,.obs-corner::after{content:"";position:absolute;background:rgba(255,255,255,.5)}
.obs-corner::before{width:9px;height:.5px;top:0;left:0}
.obs-corner::after{width:.5px;height:9px;top:0;left:0}
.obs-corner.tl{top:-7px;left:-7px}
.obs-corner.tr{top:-7px;right:-7px;transform:scaleX(-1)}
.obs-corner.bl{bottom:-7px;left:-7px;transform:scaleY(-1)}
.obs-corner.br{bottom:-7px;right:-7px;transform:scale(-1,-1)}

/* ── HEADS + eyebrows + header rule + chips ── */
.obs-head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.obs-eyebrow{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#DAE0F0;white-space:nowrap}
.obs-dot{width:6px;height:6px;border-radius:50%;background:var(--d);box-shadow:0 0 12px 1px var(--d);flex-shrink:0}
.obs-head-rule{flex:1;display:block;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,.05));flex-shrink:1;min-width:14px}
.obs-chip{font-size:12px;color:var(--nd-fg-secondary);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;cursor:help;position:relative;white-space:nowrap;transition:background .2s ease,color .2s ease}
.obs-chip:hover,.obs-chip:focus{background:rgba(255,255,255,.12);color:#F0F2F5;outline:none}
.obs-i{display:inline-block;font-size:11px;color:#b9b3d8;cursor:help;opacity:.75;transition:opacity .2s ease;margin-left:2px}
.obs-i:hover,.obs-i:focus{opacity:1;color:#d9ccff;outline:none}

/* ── embedded numbers + vertical rules ── */
.obs-embed-row{display:flex;align-items:stretch;gap:30px;margin-bottom:28px}
.obs-embed-2col{gap:0}
.obs-embed{min-width:0}
.obs-vrule{display:block;width:.5px;align-self:stretch;flex-shrink:0;background:linear-gradient(180deg,transparent,rgba(255,255,255,.22),transparent)}
.obs-embed-2col .obs-embed{flex:1;padding:0 26px}
.obs-embed-2col .obs-embed:first-child{padding-left:0}
.obs-hero{font-size:76px;line-height:.88;font-weight:400;letter-spacing:-.05em;color:#F0F2F5;text-shadow:0 0 40px var(--glow)}
.obs-mid,.obs-sec{font-size:40px;line-height:1;font-weight:400;letter-spacing:-.05em;color:#F0F2F5}
.obs-of{font-size:17px;color:var(--nd-fg-secondary);letter-spacing:0}
.obs-embed-cap{font-size:12px;color:var(--nd-fg-secondary);margin-top:8px;max-width:260px;line-height:1.45}
.obs-sublabel{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#DAE0F0;margin:4px 0 14px;display:flex;align-items:center;gap:12px}
.obs-sublabel-hint{font-size:11px;font-weight:420;letter-spacing:0;text-transform:none;color:#9aa0c0;white-space:nowrap}
.obs-sublabel-rule{flex:1;display:block;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,.04));min-width:14px}

/* ── FLOATING SIGNAL PANES (clear, overhang, two-tier shadow) ── */
.obs-sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.obs-sig-wrap{perspective:1200px;position:relative;z-index:2}
.obs-sig-wrap.rose-offset{}
.obs-sig{position:relative;overflow:visible;border-radius:12px;padding:18px 20px 16px;cursor:pointer;
  border:.5px solid var(--edge);
  backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.42),0 18px 36px -18px rgba(4,5,18,.75),0 50px 80px -50px rgba(4,5,18,.6),0 0 40px -16px var(--bloom);
  transition:transform .22s cubic-bezier(.2,0,0,1),box-shadow .22s cubic-bezier(.2,0,0,1),background .22s ease}
.tone-amber .obs-sig{background:linear-gradient(165deg,rgba(246,191,86,.20),rgba(246,191,86,.06))}
.tone-rose .obs-sig{background:linear-gradient(165deg,rgba(255,90,120,.20),rgba(255,90,120,.06))}
.obs-sig-fx{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.obs-sig-fx::after{content:"";position:absolute;top:-30px;right:-20px;width:220px;height:160px;background:radial-gradient(ellipse,var(--bloom),transparent 70%)}
.obs-sig-edge{position:absolute;top:0;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,var(--edge),transparent);z-index:2}
.obs-sig > *{position:relative;z-index:1}
.obs-sig:hover{transform:translateY(-3px)}
.obs-sig-wrap.open .obs-sig{transform:translateY(-10px);border-color:rgba(255,255,255,.5);box-shadow:inset 0 .5px 0 rgba(255,255,255,.5),0 44px 70px -24px rgba(2,3,14,.9),0 0 46px -12px var(--bloom)}
.obs-sig-top{display:flex;align-items:center;justify-content:space-between}
.obs-sig-label{font-size:13px;font-weight:620;color:#F0F2F5}
.obs-sig-win{font-size:12px;font-weight:420;color:var(--nd-fg-secondary)}
.obs-chev{font-size:17px;color:var(--acc);transition:transform .22s cubic-bezier(.2,0,0,1)}
.obs-sig-wrap.open .obs-chev{transform:rotate(90deg)}
.obs-sig-num{font-size:52px;line-height:1;font-weight:400;letter-spacing:-.05em;margin:6px 0 0;text-shadow:0 0 30px var(--bloom)}
.obs-sig-rule{display:block;height:.5px;margin:10px 0 8px;background:linear-gradient(90deg,var(--edge),transparent)}
.obs-sig-foot{font-size:12px;color:var(--nd-fg-secondary)}

/* ── INVESTIGATION PANE (near-opaque, full width, grid-rows open) ── */
.obs-invest{overflow:visible;display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.2,0,0,1)}
.obs-invest.open{grid-template-rows:1fr}
.obs-invest-clip{overflow:hidden;min-height:0}
.obs-invest-inner{position:relative;overflow:visible;margin:26px -14px 0;border-radius:10px;padding:20px 22px 14px;
  background:linear-gradient(175deg,rgba(28,30,62,.94),rgba(18,20,44,.95));
  border:.5px solid rgba(255,255,255,.2);
  backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.3),0 36px 70px -24px rgba(2,3,14,.95);
  opacity:0;transform:translateY(-16px);transition:opacity .22s ease,transform .22s cubic-bezier(.2,0,0,1)}
.obs-invest.open .obs-invest-inner{opacity:1;transform:translateY(0);transition-delay:.05s}
.obs-invest-edge{position:absolute;top:0;left:0;right:0;height:1px;z-index:2}
.obs-invest.tone-amber .obs-invest-edge{background:linear-gradient(90deg,transparent,rgba(247,170,190,.9),transparent)}
.obs-invest.tone-rose .obs-invest-edge{background:linear-gradient(90deg,transparent,rgba(255,120,140,.95),transparent)}
.obs-invest-fx{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.obs-invest.tone-amber .obs-invest-fx{background:radial-gradient(360px circle at 12% 0%,rgba(247,140,165,.18),transparent 60%)}
.obs-invest.tone-rose .obs-invest-fx{background:radial-gradient(360px circle at 50% 0%,rgba(255,80,105,.2),transparent 60%)}
.obs-invest-inner > *{position:relative;z-index:1}
.obs-invest-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:14px;margin-bottom:8px}
.obs-invest-underline{position:absolute;left:0;right:0;top:calc(1.4em + 14px);height:.5px;background:rgba(255,255,255,.1);z-index:1}
.obs-invest-title{font-size:14px;font-weight:620;color:#F0F2F5}
.obs-invest-subtitle{font-size:11px;color:var(--nd-fg-secondary);text-align:right;white-space:nowrap}
.obs-whogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 20px}
@media(max-width:520px){.obs-whogrid{grid-template-columns:1fr}}
.obs-whorow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:6px;transition:transform .2s cubic-bezier(.2,0,0,1),background .2s ease,box-shadow .2s ease}
.obs-whorow:hover{transform:translateY(-1px);background:linear-gradient(100deg,rgba(255,255,255,.07),rgba(255,255,255,.015));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),inset 0 .5px 0 rgba(255,255,255,.3)}
.obs-whorow-name{font-size:13px;font-weight:620;letter-spacing:.005em;color:#F0F2F5}
.obs-whorow-sec{font-size:11px;letter-spacing:.02em;color:#CDD4E6;margin-top:2px}
.obs-whorow-rate{font-size:19px;font-weight:420;letter-spacing:-.03em;color:#F0F2F5;text-align:right;white-space:nowrap}
.obs-whorow-tip{position:absolute;bottom:calc(100% - 2px);right:8px;padding:5px 9px;border-radius:6px;font-size:11px;color:#EAEEF8;white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .18s ease,transform .18s ease;z-index:5;
  background:rgba(40,44,84,.96);border:.5px solid rgba(255,255,255,.24);box-shadow:0 14px 28px -10px rgba(2,3,14,.9)}
.obs-whorow:hover .obs-whorow-tip{opacity:1;transform:translateY(0)}

/* ── AI PANE (clear-violet, overhangs, z3) ── */
.obs-ai{position:relative;overflow:visible;border-radius:12px;padding:16px 20px 18px;perspective:1200px;z-index:3;
  background:linear-gradient(160deg,rgba(150,120,255,.22),rgba(150,120,255,.08));
  border:.5px solid rgba(210,190,255,.3);
  backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);
  box-shadow:inset 0 .5px 0 rgba(235,225,255,.45),0 0 50px -16px rgba(150,110,255,.6),0 18px 36px -18px rgba(4,5,18,.75),0 50px 80px -50px rgba(4,5,18,.6)}
.obs-ai.ai-decline{margin:16px 0 -22px 0}
.obs-ai.ai-coord{margin:16px 0 -22px 0}
.obs-ai-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}

/* ── Ranked departments band (matches the mid-tone signals area) ── */
.ranked-band{background:linear-gradient(180deg,#6b7396 0%,#5c6488 100%);border-radius:16px;padding:22px 24px;margin-top:16px;box-shadow:0 10px 30px -12px rgba(35,47,70,.4)}
.drow-head{display:flex;align-items:center;gap:14px;padding:0 14px 8px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:4px}
.drow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;cursor:pointer;transition:background .15s ease}
.drow:hover{background:rgba(255,255,255,.06)}
.drow-caret{flex:0 0 auto;width:14px;color:#aab2ca;font-size:15px;transition:transform .15s ease;display:inline-block}
.drow-caret.open{transform:rotate(90deg)}
.drow-name{flex:0 0 auto;width:150px;font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow-track{flex:1;position:relative;height:10px;background:rgba(255,255,255,.12);border-radius:5px;display:flex;align-items:center}
.drow-fill{height:10px;border-radius:5px;min-width:4px}
.drow-ratepill{position:absolute;right:-2px;top:50%;transform:translate(100%,-50%);margin-left:8px;background:rgba(224,133,122,.2);color:#f0b0a8;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.drow-done{flex:0 0 auto;width:64px;text-align:right;font-size:15px;font-weight:700;color:#fff}
.drow-detail{padding:2px 14px 16px 42px}
.drow-stats{display:flex;gap:40px;padding:12px 0 4px}
.drow-stat-l{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#aab2ca;margin-bottom:3px}
.drow-stat-v{font-size:17px;font-weight:700;color:#e7ebf5}
.drow-alert{margin-top:10px;background:rgba(224,133,122,.14);border:1px solid rgba(224,133,122,.3);border-radius:9px;padding:10px 13px;font-size:12.5px;color:#f0d8d4;line-height:1.5}
.drow-alert b{color:#fff}
.drow-open{margin-top:12px;font-size:12px;font-weight:700;color:#7fe0b8;cursor:pointer;display:inline-block}
.drow-open:hover{color:#a4ecca}
.drow-more{border:1px dashed rgba(255,255,255,.2);margin-top:8px}
.drow-showall{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.4px;color:#9fb2e8}
.drow-pending{margin-top:10px;font-size:11px;color:#aab2ca;font-style:italic}

/* ── Hover info badge (tooltip is rendered via JS, floated on body, so it never clips) ── */
.hub-info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#c7cfdd;color:#fff;font-size:10px;font-weight:700;cursor:help;flex-shrink:0;font-style:normal;transition:background .15s ease;vertical-align:middle}
.hub-info:hover,.hub-info:focus{background:#8a97b5;outline:none}
.hub-info-light{background:rgba(255,255,255,.3);color:#fff}
.hub-info-light:hover,.hub-info-light:focus{background:rgba(255,255,255,.55)}
.hub-info-line{cursor:help}
.hub-info-line:hover,.hub-info-line:focus{outline:none;background:#fbedd0}
/* The floating tooltip element */
#hub-tip{position:fixed;max-width:290px;background:#232F46;color:#eef2fb;font-size:12px;font-weight:400;line-height:1.55;letter-spacing:0;text-transform:none;padding:12px 14px;border-radius:10px;box-shadow:0 12px 34px -6px rgba(35,47,70,.5);opacity:0;pointer-events:none;transition:opacity .15s ease;z-index:9999;display:none}
#hub-tip.show{opacity:1;display:block}

<script>
let currentDept = null;
const D = window.PORCH_DATA;
// Per-person late/very-late decline detail, sourced from the ModernLoop decline lead-time report.

function init() {
  if (!D) { document.body.innerHTML = '<p style="padding:40px;color:red">No data found. Run build.py first.</p>'; return; }
  // Title is set statically in the header markup (InnerView + descriptor).
  document.getElementById('hdr-meta').textContent = [D.meta.quarter, D.meta.period].filter(Boolean).join(' · ');
  document.getElementById('footer').textContent = 'Generated ' + D.meta.generated_date + ' · Source: ModernLoop + BrightHire + Greenhouse';
  // ── Hub tooltip: single floating element on <body>, escapes card clipping, clamps to viewport ──
  (function(){
    let tip = document.getElementById('hub-tip');
    if (!tip) { tip = document.createElement('div'); tip.id = 'hub-tip'; document.body.appendChild(tip); }
    function show(el){
      const txt = el.getAttribute('data-tip'); if (!txt) return;
      tip.textContent = txt; tip.classList.add('show');
      const r = el.getBoundingClientRect();
      // measure
      const tw = tip.offsetWidth, th = tip.offsetHeight, pad = 10;
      // prefer below the badge; if not enough room, place above
      let top = r.bottom + 9;
      if (top + th > window.innerHeight - pad) top = r.top - th - 9;
      // center horizontally on the badge, then clamp to viewport
      let left = r.left + r.width/2 - tw/2;
      left = Math.max(pad, Math.min(left, window.innerWidth - tw - pad));
      tip.style.top = Math.max(pad, top) + 'px';
      tip.style.left = left + 'px';
    }
    function hide(){ tip.classList.remove('show'); }
    document.addEventListener('mouseover', function(e){ const el = e.target.closest('.hub-info,.hub-info-line,.iv-why'); if (el) show(el); });
    document.addEventListener('mouseout', function(e){ if (e.target.closest('.hub-info,.hub-info-line,.iv-why')) hide(); });
    document.addEventListener('focusin', function(e){ const el = e.target.closest && e.target.closest('.hub-info,.hub-info-line,.iv-why'); if (el) show(el); });
    document.addEventListener('focusout', hide);
  })();
  // Global floating tooltip for BrightHire column headers
  const tt = document.createElement('div');
  tt.id = 'bh-global-tooltip';
  document.body.appendChild(tt);
  document.addEventListener('mouseover', function(e) {
    const icon = e.target.closest('.bh-tip-icon,.bh-sig-label');
    if (!icon) return;
    tt.textContent = icon.dataset.tip || '';
    tt.style.display = 'block';
  });
  document.addEventListener('mousemove', function(e) {
    if (tt.style.display === 'none') return;
    const x = e.clientX, y = e.clientY;
    const pad = 14;
    const tw = 230;
    const left = (x + pad + tw > window.innerWidth) ? x - tw - pad : x + pad;
    const top = Math.min(y - 10, window.innerHeight - 120);
    tt.style.left = left + 'px';
    tt.style.top = top + 'px';
  });
  document.addEventListener('mouseout', function(e) {
    if (!e.target.closest('.bh-tip-icon,.bh-sig-label')) return;
    tt.style.display = 'none';
  });
  const sel = document.getElementById('dept-select');
  sel.innerHTML = '';
  const allOpt = document.createElement('option');
  allOpt.value = allOpt.textContent = 'All Departments';
  sel.appendChild(allOpt);
  (D.departments || []).forEach(dept => {
    const o = document.createElement('option');
    o.value = o.textContent = dept;
    sel.appendChild(o);
  });
  selectDept('All Departments');
}
function selectDept(dept) {
  currentDept = dept;
  document.getElementById('dept-select').value = dept;
  const nav = document.getElementById('tab-nav');
  if (dept === 'All Departments') {
    // Home-page mode: no tabs, single scrolling Summary view.
    if (nav) nav.style.display = 'none';
    showTab('overview');
    renderAllDepartments();
    animateVisuals();
    return;
  }
  if (nav) nav.style.display = '';
  const data = (D.data || {})[dept] || {};
  renderOverview(data);
  renderEngagement(data);
  renderMetrics(data);
  animateVisuals();
}
// Count-up numbers + grow-in bars on render (respects reduced-motion)
function animateVisuals() {
  // Cross-fade the active panel content on each render (department / filter switch)
  var panel = document.querySelector('.tab-panel.active');
  if (panel && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    panel.classList.remove('ls-fade'); void panel.offsetWidth; panel.classList.add('ls-fade');
  }
  // One-time scan shimmer across the hero band + cards, only on first load of a view
  requestAnimationFrame(function(){
    document.querySelectorAll('.hero-band, .dsig-card, .ranked-band').forEach(function(el){
      el.classList.add('ls-scan');
      el.classList.remove('ls-run'); void el.offsetWidth; el.classList.add('ls-run');
    });
  });
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  requestAnimationFrame(function(){
    // Count up any element tagged data-count
    document.querySelectorAll('[data-count]').forEach(function(el){
      var target = parseFloat(el.getAttribute('data-count'));
      if (isNaN(target)) return;
      var suffix = el.getAttribute('data-suffix') || '';
      var decimals = (el.getAttribute('data-decimals')|0);
      var dur = 900, start = performance.now();
      function step(now){
        var p = Math.min((now - start) / dur, 1);
        var eased = 1 - Math.pow(1 - p, 3);
        var val = target * eased;
        el.textContent = (decimals ? val.toFixed(decimals) : Math.round(val).toLocaleString()) + suffix;
        if (p < 1) requestAnimationFrame(step);
        else el.textContent = (decimals ? target.toFixed(decimals) : Math.round(target).toLocaleString()) + suffix;
      }
      requestAnimationFrame(step);
    });
    // Grow bars tagged data-grow (width set from data-grow after a tick)
    document.querySelectorAll('[data-grow]').forEach(function(el){
      var w = el.getAttribute('data-grow');
      el.style.transition = 'none'; el.style.width = '0%';
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        el.style.transition = 'width 1s cubic-bezier(.2,.7,.3,1)';
        el.style.width = w;
      }); });
    });
    // Animate radial gauge rings (AI hero)
    document.querySelectorAll('.ai-gauge-ring').forEach(function(ring){
      var off = ring.getAttribute('data-gauge-off');
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        ring.style.strokeDashoffset = off;
      }); });
    });
  });
}

function showTab(id, btn) {

}
function switchToTab(id) {
  const btn = [...document.querySelectorAll('.tab-btn')].find(b =>

  showTab(id, btn);
}
// Drill from a watch item to the specific section that explains it (declines, coordination, scorecards)
function drillToSection(dept, tab, section) {
  selectDept(dept);
  switchToTab(tab);
  setTimeout(function(){
    var panelId = tab === 'metrics' ? 'tab-metrics' : tab === 'engagement' ? 'tab-engagement' : 'tab-overview';
    var sec = document.querySelector('#' + panelId + ' [data-section="' + section + '"]');
    if (sec) {
      sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      sec.classList.add('drill-flash');
      setTimeout(function(){ sec.classList.remove('drill-flash'); }, 1800);
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }, 140);
}
// Drill from a rigor role straight to that department's Interview skill coverage, filtered to that role
function drillToSkillCoverage(dept, role) {
  selectDept(dept);

    var sec = document.querySelector('#tab-engagement [data-section="Interview skill coverage \u00b7 BrightHire"]');
    if (sec) {
      // Activate the specific role tab, if it exists
      if (role) {
        var roleId = 'sk-' + role.replace(/[^a-zA-Z0-9]/g, '-');

function scoreChip(val) {
  if (val === null || val === undefined || val === '') return '<span class="score-chip score-null">—</span>';

  if (n === 100) cls = 'score-100';
  else if (n >= 80) cls = 'score-high';
  else if (n >= 60) cls = 'score-mid';
  else if (n === 0) cls = 'score-zero';
  return '<span class="score-chip ' + cls + '">' + n + '</span>';
}

  if (dept === 'Product Design') {

  return (bhArr || []).filter(r => (r.count || 0) >= 5 && (r.overall ?? 100) < 80 &&

      { color: GRAY, title: 'Most of the trained bench sat out',

  const stillDue = people.reduce((s, p) => s + (p.still_due || 0), 0);

    const util = ep.length ? Math.round(act.length / ep.length * 100) : 0;
    const concentrated = t20pct >= 45;
    const idleBench = unused >= 5 && util < 75;
    if (currentDept === 'Marketing') {
      // suppressed per curation — Marketing's box carries quality, loops-early, and skills
    } else if (currentDept === 'Product Management') {
      // Curated: 21 of 28 trained panelists active (75%) — among the best in the report.
      items.push({ color: GRN, title: 'Panel utilization is a bright spot',
        body: 'Nearly 75% of trained panelists interviewed this period, so load is being shared rather than sitting with a few. One of the healthiest participation rates in the report.' });
    } else if (currentDept === 'Engineering') {

      items.push({ color: AMB, title: 'Maximize tapping the IC3\u2013IC4 bench',
        body: 'Active IC5s carry a heavy load and every manager level is running at 90\u2013100% utilization. Look into untapped numbers for lower IC levels and try to get utilization rates to at least 80%.' });
    } else if (concentrated && idleBench) {
      items.push({ color: AMB, title: 'Capacity is the lever, not headcount',
        body: 'The busiest ' + t20n + ' carried ' + t20pct + '% of interviews while ' + unused + ' of ' + fmt(ep.length) + ' trained panelists went unused (' + util + '% utilization). Bench is available if load ever needs spreading.' });
    } else if (concentrated) {
      items.push({ color: NEU, title: 'Load is concentrated, not unusual',

    } else if (idleBench && unused >= 10 && util < 50) {

  // ── 4. Skill coverage and BrightHire usage — one grouped item ──

  if (skillsArr.length) {
    const normR = s2 => (s2 || '').toLowerCase().replace(/\bswe\b/g, 'software engineer').replace(/\bmle\b/g, 'machine learning engineer').replace(/[^a-z0-9]+/g, ' ').trim();
    const covSet = new Set(skillsArr.map(r => normR(r.role)));
    const ghostCount = [...new Set((data.job_openings || []).map(o => o.job))].filter(j => !covSet.has(normR(j))).length;
    const lowByName = {};
    skillsArr.forEach(role => (role.skills || []).forEach(s2 => { if (s2.pct < 50) { (lowByName[s2.name] = lowByName[s2.name] || []).push({ role: role.role, pct: s2.pct }); } }));
    const lowEntries = Object.entries(lowByName);
    const recurring = lowEntries.filter(e => e[1].length >= 2).sort((a, b) => b[1].length - a[1].length)[0];
    const worst = lowEntries.slice().sort((a, b) => Math.min(...a[1].map(x => x.pct)) - Math.min(...b[1].map(x => x.pct)))[0];
    const parts = [];
    if (recurring) parts.push('&ldquo;' + recurring[0] + '&rdquo; goes largely unassessed across ' + recurring[1].length + ' roles');
    else if (worst) parts.push('&ldquo;' + worst[0] + '&rdquo; sits at ' + Math.min(...worst[1].map(x => x.pct)) + '% in ' + worst[1][0].role);

      if (currentDept === 'Campus') {
        // Curated: recurring-skill phrase dropped; ghost count stays dynamic, full tail kept.
        items.push({ color: AMB, title: 'Skill coverage has blind spots',
          body: ghostCount + ' role' + (ghostCount !== 1 ? 's' : '') + ' ran ' + (ghostCount !== 1 ? 'their loops' : 'its loop') + ' entirely without BrightHire. Encouraging your interviewers to run interviews on BrightHire gets those loops captured here, and for the skills coming up short, mapping them directly into scorecards helps make sure they don\u2019t go undiscussed.' });
      } else if (currentDept === 'Product Management') {
